    tables.appendChild(sectionTitle('Per-round summary'));
    const rounds=Object.keys(pr).filter(k=>k!=='_pooled').map(Number).sort((a,b)=>a-b);
    const rows=rounds.map(r=>{ const o=pr[r]; return {
      'Round':r+1, 'Turns':o.turns, 'Token savings %':fmtPct(o.token_savings_pct),
      'Sem mean':fmt2(o.semantic_similarity&&o.semantic_similarity.mean),
      'Sem min':fmt2(o.semantic_similarity&&o.semantic_similarity.min),
      'Sem max':fmt2(o.semantic_similarity&&o.semantic_similarity.max) }; });
    if(pr._pooled) rows.push({'Round':'pooled','Turns':'','Token savings %':'',
      'Sem mean':fmt2(pr._pooled.round_mean_of_means),'Sem min':fmt2(pr._pooled.round_min_of_mins),'Sem max':''});
    tables.appendChild(dataTable(rows));
  }

  // quality detail table
  tables.appendChild(sectionTitle('Optimizer quality (headline — context retention + correctness)'));
  const qrows=[];
  const addQ=(name,o)=>{ if(o&&o.mean!=null) qrows.push({Metric:name,'Mean':fmt2(o.mean),'Median':fmt2(o.median),'Min':fmt2(o.min),'Max':fmt2(o.max)}); };
  addQ('Source-token recall',q.prompt_source_token_recall); addQ('Legacy prompt Jaccard',q.prompt_faithfulness); addQ('Evicted-content recall',q.evicted_content_recall);
  addQ('Code syntax validity',q.code_syntax_validity); addQ('Code block ratio',q.code_block_ratio);
  if(qrows.length) tables.appendChild(dataTable(qrows));

  tables.appendChild(sectionTitle('Response-overlap quality (secondary — informational only)'));
  const srows=[];
  const addS=(name,o)=>{ if(o&&o.mean!=null) srows.push({Metric:name,'Mean':fmt2(o.mean),'Median':fmt2(o.median),'Min':fmt2(o.min),'Max':fmt2(o.max)}); };
  addS('ROUGE-L F1',q.rouge_l_f1); addS('Token Jaccard',q.token_jaccard); addS('Edit similarity',q.edit_similarity);
  addS('Semantic sim',sem);
  addS('Length ratio',q.length_ratio); addS('Trigram overlap',J.secondary.trigram_overlap);
  addS('Markdown struct',J.secondary.markdown_structure_similarity); addS('Vocab richness Δ',J.secondary.vocabulary_richness_delta);
  addS('ROUGE precision',J.secondary.rouge_l_precision); addS('ROUGE recall',J.secondary.rouge_l_recall);
  addS('Response stability',J.secondary.response_stability); addS('Code struct consist.',J.secondary.code_structure_consistency);
  if(srows.length) tables.appendChild(dataTable(srows));
  const verb = q.model_verbosity_delta_turns||0;
  if(verb>0){
    const note=el('div','coupling warn');
    note.innerHTML=`<b>&#9888; ${verb} turn(s) verbose inflation (length_ratio >2.0):</b> this is MODEL verbosity under a different prompt, NOT optimizer-caused. Reported for context only.`;
    tables.appendChild(note);
  }
  const backendLogTable=el('div','tables');
  backendLogTable.appendChild(sectionTitle('Synchronized backend logs'));
  if(blogStatus === 'not_enabled'){
    backendLogTable.appendChild(Object.assign(el('div','coupling info'),{textContent:'Backend log capture was not enabled for this report.'}));
  } else {
    const logMeta = el('div','meta');
    logMeta.textContent = `${blogStatus} · ${fmt(blog.event_count)} captured · ${fmt(blog.dropped_events)} dropped · sequence ${blog.first_seq ?? '—'} → ${blog.last_seq ?? '—'}`;
    backendLogTable.appendChild(logMeta);
    const logRows = (blog.events||[]).slice(-200).map(e=>({
      'Seq': e.seq, 'Round': e.round == null ? '—' : Number(e.round)+1,
      'Time': e.timestamp || '—', 'Severity': e.severity || '—',
      'Tag': e.tag || '—', 'Log line': e.line || '—'
    }));
    if(logRows.length) backendLogTable.appendChild(dataTable(logRows));
    else backendLogTable.appendChild(Object.assign(el('div','coupling info'),{textContent:'No backend log entries were received.'}));
  }
  root._jsonTables=tables;
  root._backendLogTable=backendLogTable;
}

function renderLogView(root,L,ri,J){
  const trace=el('div','trace-section');
  const rs = (ri && isNum(ri.numTurns) && ri.numTurns>1) ? ri.numTurns : null;
  const roundTag = (isNum(ri.numTurns)&&isNum(ri.rounds)) ? ` — ${ri.numTurns} turns × ${ri.rounds} rounds` : '';
  trace.appendChild(sectionTitle('Per-turn trace (from log)'+roundTag));
  if(L.meta && Object.keys(L.meta).length){
    const m=L.meta;
    const line=el('div','meta');
    line.innerHTML=[m['Scenario'],m['Model'],m['Lemonade']?'Lemonade '+m['Lemonade']:'',m['Context profile']?'profile: '+m['Context profile']:'']
      .filter(Boolean).join(' &middot; ');
    trace.appendChild(line);
  }
  const tl=L.turnList;
  if(!tl.length){ trace.appendChild(Object.assign(el('div','meta'),{textContent:'No "Turn NN:" lines parsed from log.'})); root._logTrace=trace; return; }

  // Detect failed/estimated turns so their per-turn points are visibly flagged
  // (red column + × marker) rather than plotted as real data. `flaggedIdx` maps
  // to the shared `tl` label domain; charts on a different domain (prefix hits)
  // build their own index set from the same global turn numbers.
  const {bad, reasons}=detectBadTurns(J,L);
  const flaggedIdx=new Set(); tl.forEach((t,i)=>{ if(bad.has(t.turn)) flaggedIdx.add(i); });
  if(bad.size){
    const list=[...bad].sort((a,b)=>a-b).map(t=>'T'+t).join(', ');
    const note=el('div','coupling warn');
    note.innerHTML=`<b>&#9888; ${bad.size} flagged turn(s):</b> ${list}. `+
      `These had a failed or estimated direct-side result (empty response / missing usage), `+
      `so their per-turn points are marked <span style="color:#f85149">red ✕</span> and omitted from the line/bar series `+
      `(they are also excluded from the JSON aggregates).`;
    trace.appendChild(note);
  }

  // charts from log
  const grid=el('div','grid');
  const labels=tl.map(t=>'T'+t.turn);

  // latency per turn
  grid.appendChild(panel('Latency per turn (direct vs proxy)','ms',
    withFlags(lineBarCfg(labels,[
      {label:'Direct',color:PALETTE.direct,data:tl.map(t=>t.direct_ms)},
      {label:'Proxy',color:PALETTE.proxy,data:tl.map(t=>t.proxy_ms)}
    ], fmtSec, null, null, rs), flaggedIdx), 'Wall-clock per turn. Red ✕ columns = turns whose direct call failed/was estimated (excluded).'));

  // delta latency per turn (signed bars)
  grid.appendChild(panel('Latency delta per turn (proxy − direct)','ms',
    {labels, roundSize:rs, flagged:flaggedIdx, datasets:[{label:'Δ latency',color:'#888',data:tl.map(t=>t.delta_ms),
      colorFn:v=>v>=0?PALETTE.neg:PALETTE.pos, type:'bar'}], yFmt:fmtSec},
    'Red = proxy slower, green = proxy faster. Red ✕ columns = flagged turns (direct-side failure/estimate).'));

  // token usage per turn (direct vs proxy prompt)
  grid.appendChild(panel('Prompt tokens per turn (direct vs proxy)','tok',
    withFlags(lineBarCfg(labels,[
      {label:'Direct',color:PALETTE.direct,data:tl.map(t=>t.direct_tok)},
      {label:'Proxy',color:PALETTE.proxy,data:tl.map(t=>t.proxy_tok)}
    ], fmt, null, null, rs), flaggedIdx), 'Proxy keeps each turn\'s prompt tokens far smaller than direct. Red ✕ = direct tokens were estimated (failed turn) and omitted.'));

  // quality per turn — split into two panels because the metrics live on
  // DIFFERENT scales and mean different things:
  //   • Jaccard / ROUGE are token-overlap ratios in [0,1] (always ≥ 0).
  //   • Semantic sim is a cosine similarity in [-1,1]; NEGATIVE values are
  //     valid (the proxy and direct responses point in opposite directions in
  //     embedding space) and must NOT be clamped to 0 — clamping made them
  //     render as a flat broken line at the axis, which looked like a bug.
  grid.appendChild(panel('Response overlap per turn (jaccard / rouge, 0–1)','score',
    withFlags(lineBarCfg(labels,[
      {label:'Jaccard',color:PALETTE.jaccard,data:tl.map(t=>t.jaccard)},
      {label:'ROUGE',color:PALETTE.rouge,data:tl.map(t=>t.rouge)}
    ], fmt2, 0, 1, rs), flaggedIdx), 'Per-turn token overlap with the direct response (informational — conflates optimizer quality with model phrasing variance). Red ✕ = no direct baseline (quality uncomputable).'));

  const semData = tl.map(t=>t.sem);
  if(semData.some(v=>isNum(v))){
    grid.appendChild(panel('Semantic similarity per turn (cosine, −1..1)','score',
      withFlags(lineBarCfg(labels,[
        {label:'Semantic',color:PALETTE.sem,data:semData}
      ], fmt2, -1, 1, rs), flaggedIdx),
      'Cosine similarity of proxy vs direct response embeddings. Range is −1..1: NEGATIVE values are real (responses diverge in embedding space), not an error. Informational only — weak on code-heavy agentic traffic. Red ✕ = no direct baseline.'));
  }

  // Context faithfulness per turn — the optimizer's ACTUAL job.
  // faith = fraction of original prompt tokens surviving compaction;
  // evict = fraction of early-turn (evicted) content carried forward.
  const faithData = tl.map(t=>t.faith), evictData = tl.map(t=>t.evict);
  if(faithData.some(v=>isNum(v)) || evictData.some(v=>isNum(v))){
    grid.appendChild(panel('Context faithfulness per turn (optimizer job)','score',
      withFlags(lineBarCfg(labels,[
        {label:'Prompt faithfulness',color:PALETTE.sem,data:faithData},
        {label:'Evicted-content recall',color:'#ff7bd5',data:evictData}
      ], fmt2, 0, 1, rs), flaggedIdx),
      'PRIMARY optimizer signal: how much of the original input context survived compaction (1.0 = nothing lost). Low/declining = the optimizer dropped context the agent needed. Red ✕ = flagged turn.'));
  }

  // cache prefix hits per turn (from proxyTurns)
  const phKeys=Object.keys(L.proxyTurns).map(Number).sort((a,b)=>a-b).filter(k=>isNum(L.proxyTurns[k].prefixHits));
  if(phKeys.length){
    // phKeys is its own index domain (proxy turns only); flag by global turn number
    const phFlagged=new Set(); phKeys.forEach((k,i)=>{ if(bad.has(k)) phFlagged.add(i); });
    grid.appendChild(panel('Prefix-cache hits per turn (proxy)','tok',
      withFlags(lineBarCfg(phKeys.map(k=>'T'+k),[{label:'Prefix hits',color:PALETTE.cache,data:phKeys.map(k=>L.proxyTurns[k].prefixHits)}], fmt, null, null, rs), phFlagged),
      'Tokens reused from the KV prefix cache each proxy turn. Red ✕ = turn flagged (direct-side failure/estimate).'));
  }
  trace.appendChild(grid);
  root._logTrace=trace;

  // Keep the per-turn table separate so its charts stay in the charts phase.
  const logTable=el('div','tables');
  logTable.appendChild(sectionTitle('Per-turn table'));
  const rows=tl.map(t=>({
    'Turn':t.turn, 'Round':t.round,
    'Flag': bad.has(t.turn) ? (reasons[t.turn]||'flagged') : '',
    'Direct ms':t.direct_ms, 'Proxy ms':t.proxy_ms,
    'Δ ms':t.delta_ms,
    'Direct tok':t.direct_tok, 'Proxy tok':t.proxy_tok, 'Δ tok':t.delta_tok,
    'Raw chars':t.proxy_raw_chars, 'Cache':isNum(t.cache_hit)?t.cache_hit:'n/a',
    'Sem':t.sem, 'Jacc':t.jaccard, 'Rouge':t.rouge,
    'Faith':t.faith, 'Evict':t.evict,
    '_bad': bad.has(t.turn)
  }));
  const cols=[
    {k:'Turn',f:v=>fmt(v)},
    {k:'Round',f:v=>isNum(v)?'R'+fmt(v):'—'},
    {k:'Flag',f:v=>v?{html:`<span class="neg" title="${escapeHtml(v)}">&#9888; excluded</span>`}:''},
    {k:'Direct ms',f:v=>fmtMs(v)},
    {k:'Proxy ms',f:v=>fmtMs(v)},
    {k:'Δ ms',f:v=>cls(v,fmtMs(v),v<0)},
    {k:'Direct tok',f:v=>fmt(v)},
    {k:'Proxy tok',f:v=>fmt(v)},
    {k:'Δ tok',f:v=>cls(v,fmt(v),v<0)},
    {k:'Raw chars',f:v=>fmt(v)},
    {k:'Cache',f:v=>isNum(v)?fmt(v):'n/a'},
    {k:'Sem',f:v=>isNum(v)?fmt2(v):'n/a'},
    {k:'Jacc',f:v=>isNum(v)?fmt2(v):'n/a'},
    {k:'Rouge',f:v=>isNum(v)?fmt2(v):'n/a'}
  ];
  logTable.appendChild(dataTable(rows,cols,row=>row._bad?'badrow':''));
  root._logTable=logTable;
}

/* ============================ chart/table helpers ============================ */
function lineBarCfg(labels, datasets, yFmt, yMin, yMax, roundSize){
  return {labels, datasets, yFmt, yMin, yMax, roundSize};
}
// Attach a Set of flagged (bad) x-indices to a chart cfg so renderChart marks
// those turns (red column + ✕) and omits them from the drawn series.
function withFlags(cfg, flagged){ if(flagged instanceof Set && flagged.size) cfg.flagged=flagged; return cfg; }
function cls(v,text,neg){ return {html:`<span class="${neg?'neg':'pos'}">${text}</span>`}; }

function panel(title,hint,cfg,desc){
  const p=el('div','panel');
  p.appendChild(Object.assign(el('h2'),{textContent:title}));
  if(desc) p.appendChild(Object.assign(el('div','hint'),{textContent:desc}));
  const cv=el('canvas'); p.appendChild(cv);
  // legend
  const lg=el('div','legend');
  for(const ds of cfg.datasets){ const s=el('span'); s.innerHTML=`<i style="background:${ds.color||'#58a6ff'}"></i>${ds.label}`; lg.appendChild(s); }
  p.appendChild(lg);
  // render after attach to DOM (needs width)
  requestAnimationFrame(()=>{
    if(cfg.type==='radar'){ renderRadar(cv,cfg,null); attachHover(cv); }
    else { renderChart(cv,cfg,null); attachHover(cv); }
  });
  return p;
}

function sectionTitle(t){ return Object.assign(el('div','section-title'),{textContent:t}); }

function kvTable(title, pairs){
  const wrap=el('div','tablewrap'); const tb=el('table');
  const h=el('tr'); h.innerHTML='<th>'+title+'</th><th>Value</th>'; tb.appendChild(h);
  for(const [k,v] of pairs){ const r=el('tr'); r.innerHTML=`<td>${k}</td><td style="text-align:left">${escapeHtml(v)}</td>`; tb.appendChild(r); }
  wrap.appendChild(tb); return wrap;
}

function dataTable(rows, cols, rowClassFn){
  const wrap=el('div','tablewrap'); const tb=el('table');
  if(!rows.length){ wrap.appendChild(Object.assign(el('div'),{textContent:'—'})); return wrap; }
  const keys = cols? cols.map(c=>c.k) : Object.keys(rows[0]);
  const thead=el('tr');
  for(const k of keys){ const th=el('th'); th.textContent=k; th.dataset.k=k; thead.appendChild(th); }
  tb.appendChild(thead);
  const tbody=el('tbody');
  const buildRow=(row)=>{
    const tr=el('tr');
    const rc=rowClassFn?rowClassFn(row):''; if(rc) tr.className=rc;
    for(const k of keys){
      const td=el('td');
      if(cols){ const c=cols.find(c=>c.k===k); const out=c.f(row[k]); td.innerHTML = out&&out.html!=null?out.html:escapeHtml(out==null?'':String(out)); }
      else { const v=row[k]; td.innerHTML = (v&&v.html!=null)?v.html:escapeHtml(v==null?'':String(v)); }
      tr.appendChild(td);
    }
    return tr;
  };
  for(const row of rows){ tbody.appendChild(buildRow(row)); }
  tb.appendChild(tbody); wrap.appendChild(tb);
  // sortable
  thead.querySelectorAll('th').forEach(th=>{
    th.onclick=()=>{ const k=th.dataset.k; const asc=!th._asc; th._asc=asc;
      rows.sort((a,b)=>{ let x=a[k],y=b[k];
        if(isNum(x)&&isNum(y)) return asc?x-y:y-x; return asc?String(x).localeCompare(String(y)):String(y).localeCompare(String(x)); });
      tbody.innerHTML=''; for(const row of rows){ tbody.appendChild(buildRow(row)); }
    };
  });
  return wrap;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================ wiring ============================ */
const dz=$('#dropzone'), fi=$('#fileInput');
dz.addEventListener('click',()=>fi.click());
fi.addEventListener('change',e=>{ if(e.target.files.length) loadFiles(e.target.files); fi.value=''; });
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('hover');}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('hover');}));
dz.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });
window.addEventListener('beforeunload',()=>{});
</script>
</body>
