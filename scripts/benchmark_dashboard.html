<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MOEptimizer Benchmark Dashboard</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#30363d;
    --text:#c9d1d9; --muted:#8b949e; --accent:#58a6ff;
    --direct:#58a6ff; --proxy:#f78166; --sem:#3fb950; --jaccard:#d2a8ff;
    --rouge:#e3b341; --pos:#3fb950; --neg:#f85149; --cache:#39c5cf;
    --good:#3fb950; --warn:#e3b341; --bad:#f85149;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.45}
  a{color:var(--accent)}
  header{padding:18px 22px;border-bottom:1px solid var(--border);
    display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between}
  header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  #dropzone{border:1.5px dashed var(--border);border-radius:10px;padding:14px 18px;
    text-align:center;color:var(--muted);cursor:pointer;transition:.15s;background:var(--panel)}
  #dropzone.hover{border-color:var(--accent);background:var(--panel2);color:var(--text)}
  #dropzone b{color:var(--text)}
  select,button{background:var(--panel2);color:var(--text);border:1px solid var(--border);
    border-radius:7px;padding:7px 11px;font-size:13px;cursor:pointer}
  select:hover,button:hover{border-color:var(--accent)}
  main{padding:20px 22px;max-width:1500px;margin:0 auto}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
  .metric-label,.chart-label{grid-column:1/-1;color:var(--accent);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);padding:4px 0 6px;margin-top:6px}
  .metric-label:first-child,.chart-label:first-child{margin-top:0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card .value{font-size:26px;font-weight:650;margin-top:6px}
  .card .delta{font-size:12px;margin-top:3px;color:var(--muted)}
  .card .value.good{color:var(--good)} .card .value.bad{color:var(--bad)} .card .value.warn{color:var(--warn)}
  .card .value.info{color:var(--muted)}
  .callout{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--good);border-radius:8px;padding:12px 16px;margin-bottom:20px}
  .callout-title{font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.5px;color:var(--good);margin-bottom:6px}
  .callout p{margin:4px 0;font-size:12.5px;color:var(--text);line-height:1.5}
  .callout p:last-child{color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px}
  .chart-label{margin-top:14px}
  .grid > .callout{grid-column:1/-1}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px 8px}
  .panel h2{font-size:14px;margin:0 0 4px;font-weight:600}
  .panel .hint{color:var(--muted);font-size:11.5px;margin:0 0 8px}
  canvas{width:100%;height:260px;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:6px 2px 2px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
  th:hover{color:var(--text)}
  tbody tr:hover{background:var(--panel2)}
  tbody tr.badrow{background:rgba(248,81,73,0.10)}
  tbody tr.badrow:hover{background:rgba(248,81,73,0.16)}
  tbody tr.badrow td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
  .pos{color:var(--pos)} .neg{color:var(--neg)} .na{color:var(--muted)}
  .section-title{font-size:15px;font-weight:600;margin:26px 0 12px;border-left:3px solid var(--accent);padding-left:9px}
  .tablewrap{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
  .tablewrap table{margin:0}
  .pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;border:1px solid var(--border)}
  .pill.ok{color:var(--good);border-color:var(--good)}
  .pill.warn{color:var(--warn);border-color:var(--warn)}
  .pill.bad{color:var(--bad);border-color:var(--bad)}
  .meta{color:var(--muted);font-size:12px;margin:2px 0 0}
  #tooltip{position:fixed;pointer-events:none;background:#0b0f16;border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;font-size:12px;color:var(--text);z-index:50;display:none;
    box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:280px}
  #tooltip .tt-title{color:var(--muted);margin-bottom:4px;font-weight:600}
  #tooltip .tt-row{display:flex;justify-content:space-between;gap:14px}
  #tooltip .tt-row b{font-weight:600}
  .filebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;font-size:12.5px}
  .filebar .f{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:5px 10px}
  .filebar .f b{color:var(--text)} .filebar .f.miss{color:var(--warn);border-color:var(--warn)}
  .filebar .f.ok{color:var(--good);border-color:var(--good)}
  .err{color:var(--bad);background:var(--panel);border:1px solid var(--bad);border-radius:8px;padding:10px 14px;margin-bottom:14px}
  .coupling{margin-bottom:14px;padding:11px 14px;border-radius:9px;font-size:13px;border:1px solid var(--border);background:var(--panel)}
  .coupling.ok{border-color:var(--good);color:var(--good);background:rgba(63,185,80,.08)}
  .coupling.warn{border-color:var(--warn);color:var(--warn);background:rgba(227,179,65,.08)}
  .coupling.error{border-color:var(--bad);color:var(--bad);background:rgba(248,81,73,.08)}
  .coupling.info{border-color:var(--accent);color:var(--muted);background:var(--panel)}
  .coupling ul{margin:8px 0 0;padding-left:20px}
  .coupling li{margin:3px 0;color:var(--text)}
  .coupling .cf{display:inline-block;min-width:130px;color:var(--text);font-weight:600}
  .coupling code{background:#0b0f16;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px}
  .coupling .cw{margin-top:6px;color:var(--muted)}
  .foot{color:var(--muted);font-size:11.5px;text-align:center;padding:24px 0 8px}
</style>
</head>
<body>
<header>
  <div>
    <h1>MOEptimizer Benchmark Dashboard</h1>
    <div class="sub">Coupled <code>.json</code> report + <code>.log</code> trace &middot; drag &amp; drop or pick files</div>
  </div>
  <div class="controls">
    <div id="dropzone">Drop <b>benchmark_*.json</b> + <b>benchmark_*.log</b> here<br><span style="font-size:11px">or click to choose</span></div>
    <input id="fileInput" type="file" accept=".json,.log,.txt" multiple hidden />
    <select id="runSelect" style="display:none"></select>
  </div>
</header>
<main>
  <div id="errbox"></div>
  <div id="content" class="empty">No benchmark loaded. Drop a coupled JSON + LOG pair (they share a basename, e.g. <code>benchmark_opencode_10_5.json</code> / <code>.log</code>).</div>
</main>
<div id="tooltip"></div>

<script>
"use strict";
/* ============================ utilities ============================ */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c)=>{const e=document.createElement(t); if(c) e.className=c; return e;};
const num = s => { if(s==null) return NaN; s=String(s).trim(); if(s===''||s==='n/a'||s==='NaN') return NaN; return parseFloat(s.replace(/,/g,'')); };
const isNum = v => typeof v==='number' && !isNaN(v);
const fmt = n => isNum(n) ? Math.round(n).toLocaleString('en-US') : '—';
const fmt1 = n => isNum(n) ? n.toFixed(1) : '—';
const fmt2 = n => isNum(n) ? n.toFixed(2) : '—';
const fmtPct = n => isNum(n) ? n.toFixed(1)+'%' : '—';
const fmtMs = ms => { if(!isNum(ms)) return '—'; if(ms>=1000) return (ms/1000).toFixed(1)+'s'; return Math.round(ms)+'ms'; };
const fmtSec = ms => isNum(ms) ? (ms/1000).toFixed(1)+'s' : '—';
const statsFromValues = values => { const s=values.filter(isNum).sort((a,b)=>a-b); if(!s.length)return {}; const q=p=>s[Math.floor((s.length-1)*p)]; return {min:s[0],q1:q(.25),median:q(.5),q3:q(.75),max:s[s.length-1],mean:s.reduce((a,b)=>a+b,0)/s.length}; };
const boundedPctStats = s => s ? Object.fromEntries(Object.entries(s).map(([k,v])=>[k,isNum(v)?Math.max(0,Math.min(100,v)):v])) : {};
const baseName = f => f.replace(/\.[^.]+$/,'');

/* ============================ JSON parser ============================ */
function parseJSON(text){
  const d = JSON.parse(text);
  const out = { raw:d, config:d.config||{}, meta:{} };
  const get = (path)=>{ let c=d; for(const k of path){ if(c==null) return undefined; c=c[k]; } return c; };
  out.latency = get(['latency_ms'])||{};
  out.ttft = get(['ttft_ms'])||{};
  out.tokens = get(['tokens'])||{};
  out.quality = get(['quality'])||{};
  out.secondary = get(['secondary_quality'])||{};
  out.semantic = get(['semantic_similarity'])||{};
  out.context = get(['context_window'])||{};
  out.eviction = get(['eviction'])||{};
  out.cache = get(['cache_reuse'])||{};
  out.mtp = get(['mtp'])||{};
  out.observability = get(['proxy_observability'])||{};
  out.correctness = get(['correctness'])||{};
  out.cost = get(['cost_usd'])||{};
  out.perRound = get(['per_round'])||{};
  out.qualityTrend = get(['quality_trend'])||{};
  out.vocab = get(['vocab_richness'])||{};
  out.longHorizon = get(['long_horizon'])||{};
  out.backendLogs = get(['backend_logs'])||{};
  out.performance = get(['performance'])||{};
  out.cache_ttft = get(['cache_ttft'])||{};
  return out;
}

/* ============================ LOG parser ============================ */
  const RE_TURN = /^  Turn (\d+):\s*direct=([\d.]+)ms\/([\d,]+)tok\/([\d,]+)chars\s*proxy=([\d.]+)ms\/([\d,]+)tok\/([\d,]+)chars_raw\/([\d,]+)chars\s*raw_input=([\d,]+)tok\s*(?:ttft\(d\/p\)=([\d.]+|n\/a)ms\/([\d.]+|n\/a)ms\s*)?delta=([+-]?[\d.]+)ms\/([+-]?[\d,]+)tok\s*cache=([\d,.]+|n\/a)\/([\d,.]+|n\/a)\s*quality_sem=([+-]?[\d.]+|n\/a)\s*jaccard=([+-]?[\d.]+|n\/a)\s*rouge=([+-]?[\d.]+|n\/a)\s*faith=([+-]?[\d.]+|n\/a)\s*evict=([+-]?[\d.]+|n\/a)/;
const RE_PTURN = /^  Proxy turn (\d+)\/(\d+): raw (\d+) msgs\/([\d,]+) chars\/~?([\d,]+) tok \(pre-optimization\)/;
const RE_PBACK = /^    → backend-facing: ([\d,]+) tok \(source=([\w_]+), cached=([\d,]+), prefix_hits=([\d,]+), raw=([\d,]+) chars\)/;
const RE_DTURN = /^  Direct turn (\d+)\/(\d+): backend-facing ~?([\d,]+) tok \(raw (\d+) msgs\/([\d,]+) chars, no proxy\)/;
const RE_DBACK = /^    → backend-facing: ([\d,]+) tok \(source=([\w_]+), cached=([\d,]+)\)/;
const RE_ROUND = /^  Round (\d+)\/(\d+):/;
const RE_META = /^  (Starting benchmark|Scenario|Model|Lemonade|Proxy|Context profile|Starting moeptimizer proxy on port|Proxy ready on port):?\s*(.*)$/;

function parseLog(text){
  const lines = text.split(/\r?\n/);
  const turns = {};        // global turn index -> combined
  const proxyTurns = {};   // global idx -> {rawMsgs,rawChars,rawTok,backendTok,source,cached,prefixHits,round}
  const directTurns = {};  // global idx -> {rawMsgs,rawChars,backendTok,source,cached,round}
  const meta = {};
  let pendingProxy=null, pendingDirect=null, currentRound=0, perRound=NaN;

  // Pre-scan the "Starting benchmark" header for turns/round so the per-round ->
  // global index mapping is available DURING the main loop (the Round line's
  // denominator is the ROUNDS count, not turns/round, so it cannot be used).
  for(const line of lines){
    const mm=/(\d+)\s+turns?\s+x\s+(\d+)\s+round/i.exec(line);
    if(mm){ perRound=+mm[1]; break; }
  }

  for(const line of lines){
    let m;
    if((m=RE_ROUND.exec(line))){
      currentRound=+m[1];
    } else if((m=RE_TURN.exec(line))){
      const i=+m[1];
      turns[i] = {
        turn:i, round:currentRound,
        direct_ms:num(m[2]), direct_tok:num(m[3]), direct_chars:num(m[4]),
        proxy_ms:num(m[5]), proxy_tok:num(m[6]), proxy_raw_chars:num(m[7]), proxy_chars:num(m[8]),
        raw_input_tok:num(m[9]),
        ttft_direct_ms:(m[10]==='n/a'?NaN:num(m[10])), ttft_proxy_ms:(m[11]==='n/a'?NaN:num(m[11])),
        delta_ms:num(m[12]), delta_tok:num(m[13]),
        cache_hit:(m[14]==='n/a'?NaN:num(m[14])), cache_miss:(m[15]==='n/a'?NaN:num(m[15])),
        sem:num(m[16]), jaccard:num(m[17]), rouge:num(m[18]),
        faith:num(m[19]), evict:num(m[20])
      };
    } else if((m=RE_PTURN.exec(line))){
      // New benchmark: numerator is the WITHIN-ROUND position (1..perRound).
      // Derive the global turn index so it joins with the `Turn NN:` summary.
      const local=+m[1];
      const i = isNum(perRound) ? (currentRound-1)*perRound + local : local;
      pendingProxy=i;
      proxyTurns[i]={rawMsgs:+m[3], rawChars:num(m[4]), rawTok:num(m[5]), round:currentRound};
    } else if((m=RE_PBACK.exec(line)) && pendingProxy!=null){
      const t=proxyTurns[pendingProxy]||(proxyTurns[pendingProxy]={});
      t.backendTok=num(m[1]); t.source=m[2]; t.cached=num(m[3]); t.prefixHits=num(m[4]);
      pendingProxy=null;
    } else if((m=RE_DTURN.exec(line))){
      const local=+m[1];
      const i = isNum(perRound) ? (currentRound-1)*perRound + local : local;
      pendingDirect=i;
      directTurns[i]={rawMsgs:+m[4], rawChars:num(m[5]), backendTok:num(m[3]), round:currentRound};
    } else if((m=RE_DBACK.exec(line)) && pendingDirect!=null){
      const t=directTurns[pendingDirect]||(directTurns[pendingDirect]={});
      t.backendTok=num(m[1]); t.source=m[2]; t.cached=num(m[3]);
      pendingDirect=null;
    } else if((m=RE_META.exec(line))){
      meta[m[1]] = m[2].trim();
    }
  }
  const turnList = Object.keys(turns).map(Number).sort((a,b)=>a-b).map(i=>turns[i]);
  // derive round structure from the "Starting benchmark" meta line if present
  let numTurns=NaN, rounds=NaN;
  if(meta['Starting benchmark']){
    const mm=/(\d+)\s+turns?\s+x\s+(\d+)\s+round/i.exec(meta['Starting benchmark']);
    if(mm){ numTurns=+mm[1]; rounds=+mm[2]; }
  }
  return { turns, turnList, proxyTurns, directTurns, meta, count:turnList.length, numTurns, rounds };
}

/* ============================ pairing ============================ */
function pairFiles(files){
  const jsons=[], logs=[];
  for(const f of files){
    const n=f.name.toLowerCase();
    if(n.endsWith('.json')) jsons.push(f);
    else if(n.endsWith('.log')||n.endsWith('.txt')) logs.push(f);
  }
  const pairs=[];
  const usedLog=new Set();
  for(const j of jsons){
    const base=baseName(j.name);
    const lg=logs.find(l=>baseName(l.name)===base && !usedLog.has(l.name));
    if(lg){ usedLog.add(lg.name); pairs.push({name:base, json:j, log:lg}); }
    else pairs.push({name:base, json:j, log:null});
  }
  for(const l of logs){ if(!usedLog.has(l.name)) pairs.push({name:baseName(l.name), json:null, log:l}); }
  return pairs;
}

/* ============================ round structure ============================ */
// Derive the (turnsPerRound, rounds) shape from JSON config and/or log meta.
// The benchmark is organized as `rounds` independent conversations of
// `num_turns` turns each (e.g. 10 turns x 5 rounds = 50 global turns), NOT a
// single flat 50-turn run.
function getRoundInfo(J, L){
  let numTurns = J && J.config && J.config.num_turns;
  let rounds   = J && J.config && J.config.rounds;
  if((!isNum(numTurns) || !isNum(rounds)) && L){
    if(isNum(L.numTurns)) numTurns = L.numTurns;
    if(isNum(L.rounds))   rounds   = L.rounds;
  }
  numTurns = isNum(numTurns) && numTurns>0 ? numTurns : NaN;
  rounds   = isNum(rounds)   && rounds>0   ? rounds   : NaN;
  return { numTurns, rounds };
}

/* ============================ bad-turn detection ============================ */
// A "bad turn" is one whose direct-side measurement failed or was estimated, so
// its per-turn charts/tables would otherwise plot fabricated data as if real.
// Two sources are combined so this works with JSON, LOG, or both:
//   1. JSON authoritative list: latency_ms.excluded_cached_artifact_turns — the
//      turns the harness itself excluded from its latency/quality aggregates.
//      (NOTE: context_window.cached_or_missing_usage_turns is deliberately NOT
//      used — it lists every turn whose prompt-token count came from the proxy's
//      optimized-header estimate, which is normal for almost all proxy turns and
//      is not a failure signal.)
//   2. LOG heuristics (future-proof, needs no JSON): a direct call that returned
//      in a few ms with zero chars (empty/failed response), a direct token count
//      whose source was "estimated_missing_usage" (backend returned no usage),
//      or an uncomputable quality row (sem/jaccard/rouge all n/a). These are the
//      fingerprints of a direct-side turn that failed or returned no usable text.
// Returns a Set of global turn indices flagged as bad, plus a per-turn reason map.
function detectBadTurns(J, L){
  const bad = new Set();
  const reasons = {};              // turn -> reason string
  const flag=(t,why)=>{ if(!isNum(t)) return; bad.add(t); reasons[t]=reasons[t]?reasons[t]+'; '+why:why; };

  // 1) JSON authoritative exclusions
  if(J){
    const lat=J.latency||{};
    (lat.excluded_cached_artifact_turns||[]).forEach(t=>flag(t,'excluded (cached/failed artifact)'));
  }

  // 2) LOG heuristics
  if(L){
    // direct-side backend token count recorded as an estimate (no real usage)
    for(const [k,d] of Object.entries(L.directTurns||{})){
      if(d && d.source==='estimated_missing_usage') flag(+k,'direct usage estimated');
    }
    for(const t of (L.turnList||[])){
      // empty/failed direct response: returned almost instantly with no content
      if(isNum(t.direct_ms) && t.direct_ms<=15 && isNum(t.direct_chars) && t.direct_chars===0)
        flag(t.turn,'empty direct response');
      // quality uncomputable (no direct baseline to compare against)
      if(!isNum(t.sem) && !isNum(t.jaccard) && !isNum(t.rouge))
        flag(t.turn,'quality n/a (no baseline)');
    }
  }
  return {bad, reasons};
}

/* ============================ coupling verification ============================ */
// Confirm a JSON report and LOG trace describe the SAME benchmark run by comparing
// shared metadata (turns/round, rounds, scenario, model, endpoints) and reconciling
// the per-turn token totals. Returns {ok, issues:[{field,json,log,severity}]}.
// `ok` is false only when a critical (error-severity) mismatch is found.
function verifyCoupling(J, L){
  if(!J || !L) return {ok:true, partial:true, issues:[]};
  const cfg=J.config||{}, meta=(L.meta)||{};
  const issues=[];
  const add=(field, jv, lv, sev, fmtFn)=>{
    if(jv==null || lv==null) return;            // can't compare a missing side
    const jn = fmtFn?fmtFn(jv):jv, ln = fmtFn?fmtFn(lv):lv;
    if(String(jn)===String(ln)) return;
    issues.push({field, json:jn, log:ln, severity:sev||'warn'});
  };
  const s = v => isNum(v)?String(v):'—';
  // structural metadata (JSON config vs log header)
  add('turns/round', cfg.num_turns, L.numTurns, 'error', s);
  add('rounds',      cfg.rounds,   L.rounds,   'error', s);
  add('model',       cfg.model,     meta['Model'], 'error');
  add('scenario',    cfg.scenario,  meta['Scenario']?meta['Scenario'].split(/\s+/)[0]:null, 'warn');
  add('lemonade_url',cfg.lemonade_url, meta['Lemonade'], 'warn');
  const lp = meta['Proxy'] ? (meta['Proxy'].match(/:(\d+)(?=\/|$)/)||[])[1] : null;
  add('proxy_port',  cfg.proxy_port, lp?+lp:null, 'warn', s);
  // counts & token totals (strongest signal of a wrong pairing)
  const expectedTurns = (isNum(cfg.num_turns)&&isNum(cfg.rounds)) ? cfg.num_turns*cfg.rounds : null;
  add('turn count',  expectedTurns, L.count, 'error', s);
  const sumTok = key => L.turnList.reduce((a,t)=>a+(isNum(t[key])?t[key]:0),0);
  add('total_direct_prompt', J.tokens&&J.tokens.total_direct_prompt, sumTok('direct_tok'), 'error', fmt);
  add('total_proxy_prompt',  J.tokens&&J.tokens.total_proxy_prompt,  sumTok('proxy_tok'),  'error', fmt);
  const ok = !issues.some(i=>i.severity==='error');
  return {ok, issues};
}

// Render a prominent coupling verdict banner. Alerts (red) on critical mismatches,
// warns (yellow) on metadata drift, confirms (green) when fully coupled, and notes
// when only one file is present so the check can't run.
function renderCouplingBanner(root, J, L){
  const box=el('div','coupling');
  if(!J || !L){
    box.className+=' info';
    box.innerHTML=`<b>Coupling not verifiable.</b> Only ${J?'the JSON report':'the LOG trace'} is loaded — pair it with its matching ${J?'.log':'.json'} (same basename) to confirm they describe the same run.`;
    root.appendChild(box); return;
  }
  const {ok, issues}=verifyCoupling(J,L);
  const errs=issues.filter(i=>i.severity==='error');
  const warns=issues.filter(i=>i.severity==='warn');
  if(issues.length===0){
    box.className+=' ok';
    box.innerHTML=`<b>&#10003; Files coupled.</b> Metadata and token totals match across the JSON report and LOG trace — they describe the same run.`;
  } else if(errs.length){
    box.className+=' error';
    let html=`<b>&#10007; Files are NOT coupled.</b> ${errs.length} critical mismatch(es) between the JSON report and LOG trace:`;
    html+=`<ul>${errs.map(i=>`<li><span class="cf">${i.field}</span> JSON <code>${i.json}</code> vs LOG <code>${i.log}</code></li>`).join('')}</ul>`;
    if(warns.length) html+=`<div class="cw">Also ${warns.length} minor difference(s): ${warns.map(i=>`${i.field} (JSON ${i.json} / LOG ${i.log})`).join('; ')}.</div>`;
    box.innerHTML=html;
  } else {
    box.className+=' warn';
    box.innerHTML=`<b>&#9888; Files coupled, but ${warns.length} metadata field(s) differ:</b> ${warns.map(i=>`${i.field} (JSON <code>${i.json}</code> / LOG <code>${i.log}</code>)`).join('; ')}.`;
  }
  root.appendChild(box);
}

/* ============================ chart engine ============================ */
const PALETTE = { direct:'#58a6ff', proxy:'#f78166', directSoft:'#8fc4ff', proxySoft:'#fca891',
  sem:'#3fb950', jaccard:'#d2a8ff',
  rouge:'#e3b341', pos:'#3fb950', neg:'#f85149', cache:'#39c5cf', raw:'#8b949e' };

function setupCanvas(canvas){
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  const w=rect.width||canvas.clientWidth||440, h=rect.height||260;
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
  const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w,h};
}

// cfg: {labels, datasets:[{label,color,data,axis?,type?,fill?}], yFmt, dual?, title, yMin?, yMax?}
function renderChart(canvas, cfg, hover){
  const {ctx,w,h}=setupCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const padL=52, padR=cfg.dual?58:18, padT=14, padB=34;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const labels=cfg.labels||[];
  const n=labels.length;
  const barSets = cfg.datasets.filter(ds=>ds.type==='bar');
  const hasBars = barSets.length>0;
  // bar categories occupy slots of width plotW/n, centered (so the last group
  // never overflows the right edge the way xAt(i)=padL+plotW would)
  const xBarCenter = i => padL + plotW*(i+0.5)/n;
  const axes={y:{min:Infinity,max:-Infinity}, y1:{min:Infinity,max:-Infinity}};
  for(const ds of cfg.datasets){
    const ax=ds.axis==='y1'?'y1':'y';
    for(const v of ds.data){
      if(cfg.type==='boxplot' && v){
        for(const value of [v.min,v.q1,v.median,v.q3,v.max,v.mean]) if(isNum(value)){ axes[ax].min=Math.min(axes[ax].min,value); axes[ax].max=Math.max(axes[ax].max,value); }
      } else if(isNum(v)){ axes[ax].min=Math.min(axes[ax].min,v); axes[ax].max=Math.max(axes[ax].max,v); }
    }
  }
  if(!isFinite(axes.y.min)){ axes.y.min=0; axes.y.max=1; }
  if(cfg.yMin!=null) axes.y.min=cfg.yMin; if(cfg.yMax!=null) axes.y.max=cfg.yMax;
  if(cfg.dual && !isFinite(axes.y1.min)){ axes.y1.min=0; axes.y1.max=1; }
  // pad
  const pad=(mx,mn)=> (mx-mn)*0.08 || 1;
  axes.y.min=Math.min(axes.y.min, cfg.yMin!=null?cfg.yMin:axes.y.min-pad(axes.y.max-axes.y.min));
  // Respect an explicit yMax (e.g. quality scores capped at 1.0): don't add the
  // 8% headroom padding that would push the axis top above the requested cap.
  if(cfg.yMax==null) axes.y.max=axes.y.max+pad(axes.y.max-axes.y.min);
  if(cfg.dual){ axes.y1.min=Math.min(axes.y1.min,0); axes.y1.max=axes.y1.max+pad(axes.y1.max-axes.y1.min); }
  // bar charts encode magnitude: anchor the value axis at zero for honest comparison
  if(cfg.datasets.some(ds=>ds.type==='bar')){
    axes.y.min=0;
    if(cfg.dual && cfg.datasets.some(ds=>ds.type==='bar'&&ds.axis==='y1')) axes.y1.min=0;
  }

  const xAt = i => n<=1 ? padL+plotW/2 : padL + (plotW*i/(n-1));
  const yAt = (v,ax) => { const A=ax==='y1'?axes.y1:axes.y; return padT + plotH*(1-(v-A.min)/(A.max-A.min||1)); };

  if(cfg.type==='interval'){
    for(const ds of cfg.datasets){
      const color=ds.color||'#58a6ff';
      for(let i=0;i<n;i++){
        const range=ds.intervals[i]; if(!range||!isNum(range.min)||!isNum(range.max)||!isNum(ds.data[i])) continue;
        const x=xAt(i), yMin=yAt(range.min,'y'), yMax=yAt(range.max,'y'), yMean=yAt(ds.data[i],'y');
        ctx.strokeStyle=color; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x,yMin); ctx.lineTo(x,yMax); ctx.stroke();
        ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x-7,yMin); ctx.lineTo(x+7,yMin); ctx.moveTo(x-7,yMax); ctx.lineTo(x+7,yMax); ctx.stroke();
        ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,yMean,4,0,Math.PI*2); ctx.fill();
      }
    }
  }
  if(cfg.type==='boxplot'){
    const groups=cfg.datasets.length;
    const slot=plotW/Math.max(1,n), groupW=Math.min(slot*0.72, 54);
    for(let i=0;i<n;i++){
      for(let di=0;di<groups;di++){
        const ds=cfg.datasets[di], s=ds.data[i];
        if(!s||![s.min,s.median,s.max].every(isNum)) continue;
        const q1=isNum(s.q1)?s.q1:s.median, q3=isNum(s.q3)?s.q3:s.median;
        const x=xBarCenter(i)+(di-(groups-1)/2)*(groupW/Math.max(1,groups));
        const boxW=groupW/Math.max(1,groups)*0.72;
        const color=ds.color||'#58a6ff';
        const yMin=yAt(s.min,'y'), yQ1=yAt(q1,'y'), yMed=yAt(s.median,'y'), yQ3=yAt(q3,'y'), yMax=yAt(s.max,'y');
        ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(x,yMin); ctx.lineTo(x,yQ1); ctx.moveTo(x,yQ3); ctx.lineTo(x,yMax); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x-boxW*.35,yMin); ctx.lineTo(x+boxW*.35,yMin); ctx.moveTo(x-boxW*.35,yMax); ctx.lineTo(x+boxW*.35,yMax); ctx.stroke();
        ctx.globalAlpha=0.28; ctx.fillRect(x-boxW/2,yQ3,boxW,yQ1-yQ3); ctx.globalAlpha=1;
        ctx.strokeRect(x-boxW/2,yQ3,boxW,yQ1-yQ3);
        // Keep the median legible over the translucent box, including when
        // its value is close to q1 or q3.
        ctx.strokeStyle='#ffffff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x-boxW/2,yMed); ctx.lineTo(x+boxW/2,yMed); ctx.stroke();
        // Mean marker (a small ✕), distinct from the median line (#8). Drawn only
        // when the stats carry a mean; white outline keeps it legible over the box.
        if(isNum(s.mean)){
          const yMean=yAt(s.mean,'y'), r=3.5;
          ctx.strokeStyle='#ffffff'; ctx.lineWidth=3;
          ctx.beginPath(); ctx.moveTo(x-r,yMean-r); ctx.lineTo(x+r,yMean+r); ctx.moveTo(x-r,yMean+r); ctx.lineTo(x+r,yMean-r); ctx.stroke();
          ctx.strokeStyle=color; ctx.lineWidth=1.4;
          ctx.beginPath(); ctx.moveTo(x-r,yMean-r); ctx.lineTo(x+r,yMean+r); ctx.moveTo(x-r,yMean+r); ctx.lineTo(x+r,yMean-r); ctx.stroke();
        }
      }
    }
  }

  // grid + y ticks
  ctx.font='11px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textBaseline='middle';
  const ticks=5;
  for(let t=0;t<=ticks;t++){
    const v=axes.y.min+(axes.y.max-axes.y.min)*t/ticks;
    const y=padT+plotH*(1-t/ticks);
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+plotW,y); ctx.stroke();
    ctx.fillStyle='#8b949e'; ctx.textAlign='right';
    ctx.fillText((cfg.yFmt||fmt)(v), padL-6, y);
    if(cfg.dual){
      const v1=axes.y1.min+(axes.y1.max-axes.y1.min)*t/ticks;
      ctx.textAlign='left'; ctx.fillStyle='#8b949e';
      ctx.fillText((cfg.yFmt1||cfg.yFmt||fmt)(v1), padL+plotW+6, y);
    }
  }
  // x labels (sparse)
  ctx.fillStyle='#8b949e'; ctx.textAlign='center'; ctx.textBaseline='top';
  const step=Math.max(1,Math.ceil(n/10));
  const xLabelAt = hasBars ? xBarCenter : xAt;
  for(let i=0;i<n;i+=step){ ctx.fillText(labels[i], xLabelAt(i), padT+plotH+6); }
  if(n>0) ctx.fillText(labels[n-1], xLabelAt(n-1), padT+plotH+6);

  // flagged (bad) turns: shade the column so failed/estimated data points are
  // visibly marked instead of being read as real measurements. `cfg.flagged` is
  // a Set of x-indices (into `labels`).
  const flagged = cfg.flagged instanceof Set ? cfg.flagged : null;
  if(flagged && flagged.size){
    const colW = plotW/n;
    for(const i of flagged){
      if(i<0||i>=n) continue;
      const cx = (hasBars?xBarCenter(i):xAt(i));
      const bx = cx - colW/2;
      ctx.fillStyle='rgba(248,81,73,0.12)';          // red wash
      ctx.fillRect(bx, padT, colW, plotH);
      ctx.strokeStyle='rgba(248,81,73,0.45)'; ctx.lineWidth=1; ctx.setLineDash([2,2]);
      ctx.beginPath(); ctx.moveTo(cx,padT); ctx.lineTo(cx,padT+plotH); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // datasets (grouped bars + lines). Flagged (bad) turns are skipped entirely so
  // estimated/failed values are never drawn as if they were real measurements.
  const isFlagged = i => flagged ? flagged.has(i) : false;
  const groupW = Math.max(2, plotW/n*0.72);
  const bw = barSets.length>1 ? Math.max(1.5, groupW/barSets.length) : groupW;
  for(let di=0; di<cfg.datasets.length; di++){
    const ds=cfg.datasets[di];
    const ax=ds.axis==='y1'?'y1':'y';
    const color=ds.color||PALETTE[ds.label.toLowerCase().replace(/[^a-z]/g,'')]||'#58a6ff';
    if(cfg.type==='interval'||cfg.type==='boxplot') continue;
    if(ds.type==='bar'){
      const bi=barSets.indexOf(ds);
      const off=(bi-barSets.length/2)*bw;
      for(let i=0;i<n;i++){ const v=ds.data[i]; if(!isNum(v)||isFlagged(i))continue;
        const x=xBarCenter(i)+off, y=yAt(v,ax); const bh=padT+plotH-y;
        ctx.fillStyle = ds.colorFn ? ds.colorFn(v) : color; ctx.globalAlpha=0.85;
        ctx.fillRect(x,y,bw,bh); ctx.globalAlpha=1;
      }
    } else {
      // Rounds are independent conversations, so the line must NOT connect the
      // last turn of one round to the first turn of the next. Break the path at
      // each round boundary (every `roundSize` points) in addition to NaN/flagged.
      const rSize = (isNum(cfg.roundSize) && cfg.roundSize>1) ? cfg.roundSize : 0;
      ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath();
      let started=false;
      for(let i=0;i<n;i++){
        if(rSize && i>0 && i%rSize===0) started=false;   // new round -> new segment
        const v=ds.data[i]; if(!isNum(v)||isFlagged(i)){started=false;continue;}
        const x=xAt(i), y=yAt(v,ax);
        if(!started){ctx.moveTo(x,y);started=true;} else ctx.lineTo(x,y);
      }
      ctx.stroke();
      if(ds.fill){ ctx.lineTo(xAt(n-1),padT+plotH); ctx.lineTo(xAt(0),padT+plotH); ctx.closePath();
        ctx.fillStyle=color; ctx.globalAlpha=0.10; ctx.fill(); ctx.globalAlpha=1; }
      // points
      for(let i=0;i<n;i++){ const v=ds.data[i]; if(!isNum(v)||isFlagged(i))continue;
        ctx.fillStyle=color; ctx.beginPath(); ctx.arc(xAt(i),yAt(v,ax),2.2,0,7); ctx.fill(); }
    }
  }
  // mark each flagged turn with a small hollow "×" at the plot baseline so the
  // gap reads as "measurement excluded", not "value is zero / missing point".
  if(flagged && flagged.size){
    ctx.strokeStyle='rgba(248,81,73,0.9)'; ctx.lineWidth=1.4;
    for(const i of flagged){ if(i<0||i>=n) continue;
      const cx=(hasBars?xBarCenter(i):xAt(i)), cy=padT+plotH-7, r=3.2;
      ctx.beginPath(); ctx.moveTo(cx-r,cy-r); ctx.lineTo(cx+r,cy+r);
      ctx.moveTo(cx+r,cy-r); ctx.lineTo(cx-r,cy+r); ctx.stroke();
    }
  }
  // round separators (turns are grouped into rounds of cfg.roundSize)
  if(cfg.roundSize && cfg.roundSize>1 && n>cfg.roundSize){
    const rs=cfg.roundSize;
    ctx.font='10px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.textBaseline='top'; ctx.textAlign='center';
    let r=0;
    for(let i=0;i<n;i+=rs){
      r++;
      if(i>0){
        const x=xAt(i);
        ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=1; ctx.setLineDash([2,3]);
        ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,padT+plotH); ctx.stroke(); ctx.setLineDash([]);
      }
      const segEnd=Math.min(i+rs-1,n-1);
      const xc=(xAt(i)+xAt(segEnd))/2;
      ctx.fillStyle='#8b949e';
      ctx.fillText('R'+r, xc, padT+1);
    }
  }

  // hover guide
  if(hover!=null && hover>=0 && hover<n){
    const x=xAt(hover);
    ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,padT+plotH); ctx.stroke(); ctx.setLineDash([]);
  }
  canvas._geom={padL,padR,padT,padB,plotW,plotH,n,xAt,labels,cfg};
}

// Radar / spider chart — multivariate comparison on a shared 0..1 (or yMin..yMax) scale.
// Used for the Quality metrics panel (FT Visual Vocabulary: "part-to-whole" / multivariate).
function renderRadar(canvas, cfg, hover){
  const {ctx,w,h}=setupCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const padL=48, padR=48, padT=20, padB=20;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const labels=cfg.labels||[];
  const n=labels.length;
  const vMin = cfg.yMin!=null?cfg.yMin:0;
  const vMax = cfg.yMax!=null?cfg.yMax:1;
  const cx=padL+plotW/2, cy=padT+plotH/2;
  const R=Math.min(plotW,plotH)/2 - 40;
  const angle = i => -Math.PI/2 + (n<=1?0:i*2*Math.PI/n);
  const ptAt = (i,v)=>{ const r=R*((v-vMin)/((vMax-vMin)||1)); const a=angle(i); return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };

  // concentric grid rings
  const rings=4;
  ctx.font='10px -apple-system,Segoe UI,Roboto,sans-serif';
  for(let g=1;g<=rings;g++){
    const lvl=vMin+(vMax-vMin)*g/rings;
    ctx.beginPath();
    for(let i=0;i<n;i++){ const [x,y]=ptAt(i,lvl); if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    ctx.closePath();
    ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1; ctx.stroke();
  }
  // axis spokes + labels
  ctx.fillStyle='#8b949e'; ctx.textBaseline='middle';
  for(let i=0;i<n;i++){
    const [ox,oy]=ptAt(i,vMax);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(ox,oy);
    ctx.strokeStyle='rgba(255,255,255,0.10)'; ctx.lineWidth=1; ctx.stroke();
    const a=angle(i); const lx=cx+(R+13)*Math.cos(a), ly=cy+(R+13)*Math.sin(a);
    ctx.textAlign = Math.abs(Math.cos(a))<0.3 ? 'center' : (Math.cos(a)>0?'left':'right');
    ctx.fillText(labels[i], lx, ly);
  }
  // datasets (polygons)
  for(const ds of cfg.datasets){
    const color=ds.color||PALETTE[ds.label.toLowerCase().replace(/[^a-z]/g,'')]||'#58a6ff';
    ctx.beginPath();
    let started=false;
    for(let i=0;i<n;i++){ const v=ds.data[i]; if(!isNum(v))continue; const [x,y]=ptAt(i,v); if(!started){ctx.moveTo(x,y);started=true;} else ctx.lineTo(x,y); }
    if(started){ ctx.closePath();
      ctx.fillStyle=color; ctx.globalAlpha=0.18; ctx.fill(); ctx.globalAlpha=1;
      ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
    }
    for(let i=0;i<n;i++){ const v=ds.data[i]; if(!isNum(v))continue; const [x,y]=ptAt(i,v);
      ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,2.6,0,7); ctx.fill(); }
  }
  // hover spoke
  if(hover!=null && hover>=0 && hover<n){
    const [hx,hy]=ptAt(hover, vMax);
    ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(hx,hy); ctx.stroke(); ctx.setLineDash([]);
  }
  canvas._geom={padL,padR,padT,padB,plotW,plotH,n,labels,cfg,radar:true,cx,cy,R,angle};
}

function attachHover(canvas){
  if(canvas._hoverBound) return; canvas._hoverBound=true;
  const tip=$('#tooltip');
  canvas.addEventListener('mousemove',e=>{
    const g=canvas._geom; if(!g) return;
    const rect=canvas.getBoundingClientRect();
    const x=e.clientX-rect.left, y=e.clientY-rect.top;
    if(g.radar){
      const dx=x-g.cx, dy=y-g.cy;
      if(Math.hypot(dx,dy) > g.R+34){ tip.style.display='none'; renderRadar(canvas,g.cfg,null); return; }
      const ma=Math.atan2(dy,dx);
      let best=0,bestd=Infinity;
      for(let i=0;i<g.n;i++){ const diff=Math.atan2(Math.sin(ma-g.angle(i)),Math.cos(ma-g.angle(i))); const d=Math.abs(diff); if(d<bestd){bestd=d;best=i;} }
      renderRadar(canvas,g.cfg,best);
      let html=`<div class="tt-title">${g.labels[best]}</div>`;
      for(const ds of g.cfg.datasets){
        const v=ds.data[best];
        const col=ds.color||PALETTE[ds.label.toLowerCase().replace(/[^a-z]/g,'')]||'#58a6ff';
        const f=g.cfg.yFmt||fmt2;
        html+=`<div class="tt-row"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${col};margin-right:5px"></i>${ds.label}</span><b>${f?f(v):fmt(v)}</b></div>`;
      }
      tip.innerHTML=html; tip.style.display='block';
      tip.style.left=Math.min(e.clientX+14, window.innerWidth-tip.offsetWidth-10)+'px';
      tip.style.top=(e.clientY+14)+'px';
      return;
    }
    if(g.cfg.type==='boxplot'){
      if(x<g.padL||x>g.padL+g.plotW||g.n<1){ tip.style.display='none'; renderChart(canvas,g.cfg,null); return; }
      const idx=g.n<=1?0:Math.max(0,Math.min(g.n-1,Math.round((x-g.padL)/g.plotW*(g.n-1))));
      renderChart(canvas,g.cfg,idx);
      let html=`<div class="tt-title">${g.labels[idx]}</div>`;
      for(const ds of g.cfg.datasets){
        const s=ds.data[idx]; if(!s||!isNum(s.median)) continue;
        const col=ds.color||PALETTE[ds.label.toLowerCase().replace(/[^a-z]/g,'')]||'#58a6ff';
        const f=g.cfg.yFmt||fmt2;
        const q1=isNum(s.q1)?s.q1:s.median, q3=isNum(s.q3)?s.q3:s.median;
        html+=`<div class="tt-row"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${col};margin-right:5px"></i>${ds.label}</span><b>min ${f(s.min)} · q1 ${f(q1)} · med ${f(s.median)} · q3 ${f(q3)} · max ${f(s.max)}</b></div>`;
      }
      tip.innerHTML=html; tip.style.display='block';
      tip.style.left=Math.min(e.clientX+14, window.innerWidth-tip.offsetWidth-10)+'px';
      tip.style.top=(e.clientY+14)+'px';
      return;
    }
    if(x<g.padL||x>g.padL+g.plotW||g.n<=1){ tip.style.display='none'; renderChart(canvas,g.cfg,null); return; }
    let idx=Math.round((x-g.padL)/g.plotW*(g.n-1));
    idx=Math.max(0,Math.min(g.n-1,idx));
    renderChart(canvas,g.cfg,idx);
    // build tooltip
    let html=`<div class="tt-title">${g.labels[idx]}</div>`;
    const isBad = g.cfg.flagged instanceof Set && g.cfg.flagged.has(idx);
    if(isBad) html+=`<div class="tt-row" style="color:#f85149"><b>&#9888; excluded turn — direct-side failed/estimated</b></div>`;
    for(const ds of g.cfg.datasets){
      const v=ds.data[idx];
      const col=ds.color||PALETTE[ds.label.toLowerCase().replace(/[^a-z]/g,'')]||'#58a6ff';
      const f=ds.axis==='y1'?(g.cfg.yFmt1||g.cfg.yFmt):g.cfg.yFmt;
      const range = g.cfg.type==='interval' && ds.intervals ? ds.intervals[idx] : null;
      const shown = isBad ? '—' : (range ? `${f?f(v):fmt(v)} (${f?f(range.min):fmt(range.min)}–${f?f(range.max):fmt(range.max)})` : (f?f(v):fmt(v)));
      html+=`<div class="tt-row"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${col};margin-right:5px"></i>${ds.label}</span><b>${shown}</b></div>`;
    }
    tip.innerHTML=html; tip.style.display='block';
    tip.style.left=Math.min(e.clientX+14, window.innerWidth-tip.offsetWidth-10)+'px';
    tip.style.top=(e.clientY+14)+'px';
  });
  canvas.addEventListener('mouseleave',()=>{ tip.style.display='none'; if(canvas._geom) (canvas._geom.radar?renderRadar:renderChart)(canvas,canvas._geom.cfg,null); });
}

/* ============================ state ============================ */
const state={ pairs:[], active:0 };

function loadFiles(fileList){
  const pairs=pairFiles(Array.from(fileList));
  if(!pairs.length){ showErr('No .json or .log files recognized.'); return; }
  const readers=pairs.map(p=>new Promise(res=>{
    const r={name:p.name, jsonName:p.json&&p.json.name, logName:p.log&&p.log.name};
    const read=f=> f? f.text().catch(()=>null): Promise.resolve(null);
    Promise.all([read(p.json),read(p.log)]).then(([jt,lt])=>{
      try{ r.json = jt? parseJSON(jt): null; }catch(e){ r.jsonErr=e.message; }
      try{ r.log = lt? parseLog(lt): null; }catch(e){ r.logErr=e.message; }
      res(r);
    });
  }));
  Promise.all(readers).then(results=>{
    state.pairs=results; state.active=0;
    const sel=$('#runSelect');
    if(results.length>1){ sel.style.display=''; sel.innerHTML='';
      results.forEach((r,i)=>{ const o=el('option'); o.value=i; o.textContent=r.name; sel.appendChild(o); });
      sel.onchange=()=>{ state.active=+sel.value; render(); };
    } else sel.style.display='none';
    render();
  });
}

function showErr(msg){ const b=$('#errbox'); b.innerHTML=`<div class="err">${msg}</div>`; }
function clearErr(){ $('#errbox').innerHTML=''; }

/* ============================ render ============================ */
function render(){
  clearErr();
  const p=state.pairs[state.active];
  if(!p){ $('#content').className='empty'; $('#content').textContent='No benchmark loaded.'; return; }
  const root=$('#content'); root.className=''; root.innerHTML='';

  // file status bar
  const fb=el('div','filebar');
  const fj=el('div','f '+(p.json?'ok':'miss')); fj.innerHTML=`<b>JSON:</b> ${p.jsonName||'missing'}`; fb.appendChild(fj);
  const fl=el('div','f '+(p.log?'ok':'miss')); fl.innerHTML=`<b>LOG:</b> ${p.logName||'missing'}`; fb.appendChild(fl);
  if(p.jsonErr) fb.appendChild(Object.assign(el('div','f miss'),{textContent:'JSON parse error: '+p.jsonErr}));
  if(p.logErr) fb.appendChild(Object.assign(el('div','f miss'),{textContent:'LOG parse error: '+p.logErr}));
  if(p.json && p.log){
    const jt=p.json.tokens.total_direct_prompt, lt=p.log.count;
    const ri=getRoundInfo(p.json,p.log);
    let txt=`${lt} log turns`;
    if(isNum(ri.numTurns) && isNum(ri.rounds)) txt+=` · ${ri.numTurns} turns × ${ri.rounds} rounds`;
    else if(isNum(ri.numTurns)) txt+=` · ${ri.numTurns} turns/round`;
    const note=el('div','f'); note.innerHTML=`<b>Coupled:</b> ${txt}`; fb.appendChild(note);
  }
  root.appendChild(fb);

  // coupling verification (alerts the user if the JSON + LOG are not the same run)
  renderCouplingBanner(root, p.json, p.log);

  if(!p.json && !p.log){ root.appendChild(Object.assign(el('div','empty'),{textContent:'Neither file could be parsed.'})); return; }

  const ri=getRoundInfo(p.json,p.log);
  if(p.json) renderJSONView(root,p.json,p.log,ri);
  if(p.log) renderLogView(root,p.log,ri,p.json);
  if(root._logTrace) root.appendChild(root._logTrace);
  if(root._jsonTables) root.appendChild(root._jsonTables);
  if(root._logTable) root.appendChild(root._logTable);
  if(root._backendLogTable) root.appendChild(root._backendLogTable);
}

function renderJSONView(root,J,L,ri){
  const c=J.config, tok=J.tokens, lat=J.latency, ttft=J.ttft, mtp=J.mtp, obs=J.observability, q=J.quality, sem=J.semantic, sec=J.secondary, ctxw=J.context, cache=J.cache, ev=J.eviction, pr=J.perRound, perf=J.performance||{};
  const faith=q.prompt_source_token_recall!=null?q.prompt_source_token_recall:(q.prompt_faithfulness!=null?q.prompt_faithfulness:null);
  const evict=q.evicted_content_recall!=null?q.evicted_content_recall:null;

  // ---- summary cards ----
  const cards=el('div','cards');
  const metricLabel = text => Object.assign(el('div','metric-label'),{textContent:text});
  const card=(label,value,cls,delta)=>{ const d=el('div','card');
    d.appendChild(Object.assign(el('div','label'),{textContent:label}));
    d.appendChild(Object.assign(el('div','value '+(cls||'')),{textContent:value}));
    if(delta) d.appendChild(Object.assign(el('div','delta'),{textContent:delta}));
    return d; };
  cards.appendChild(metricLabel('Input reduction'));
  // Token savings — two complementary baselines, clearly labelled so they are
  // not read as contradictory:
  //  • vs proxy raw input = INTRINSIC compaction: what the proxy did to the
  //    input it received (raw_input → optimized). Isolates the optimizer's own
  //    work; unaffected by backend tokenization or the direct path.
  //  • vs direct = REAL-WORLD savings: proxy output vs the full un-compacted
  //    direct conversation (with proxy vs without). Higher because the direct
  //    path sends the entire context every turn (no eviction/compaction).
  cards.appendChild(card('Token savings (intrinsic, vs raw input)', fmtPct(tok.token_savings_vs_raw_pct), isNum(tok.token_savings_vs_raw_pct)?(tok.token_savings_vs_raw_pct>0?'good':'warn'):'info',
    `HEADLINE · ${fmt(tok.total_raw_input_prompt)} → ${fmt(tok.total_proxy_prompt)} prompt tok · proxy's own compaction (honest metric)`));
  cards.appendChild(card('Token savings (real-world, vs direct)', fmtPct(tok.token_savings_pct), isNum(tok.token_savings_pct)?(tok.token_savings_pct>0?'good':'warn'):'info',
    `${fmt(tok.total_direct_prompt)} → ${fmt(tok.total_proxy_prompt)} prompt tok · inflated: direct sends full context every turn`));
  const latD = lat.delta_proxy_minus_direct_ms;
  cards.appendChild(metricLabel('Runtime & proxy cost'));
  // Focus this card on the latency OVERHEAD the proxy adds (proxy − direct),
  // not the absolute proxy latency (which is dominated by backend generation
  // time and is not what the proxy controls). Positive Δ = proxy slower (bad).
  const latDMean = latD && isNum(latD.mean) ? latD.mean : NaN;
  const dPct = (lat.direct && isNum(lat.direct.mean) && lat.direct.mean>0 && isNum(latDMean))
    ? (latDMean/lat.direct.mean*100) : NaN;
  cards.appendChild(card('Latency overhead (proxy − direct)',
    (isNum(latDMean)?(latDMean>=0?'+':'')+fmtSec(latDMean):'—'),
    isNum(latDMean)?(latDMean>0?'bad':'good'):'',
    `proxy ${fmtSec(lat.proxy&&lat.proxy.mean)} vs direct ${fmtSec(lat.direct&&lat.direct.mean)}${isNum(dPct)?` · ${(dPct>=0?'+':'')+dPct.toFixed(1)}%`:''}`));
  // TTFT (time-to-first-token) — only present when the run used --measure-ttft.
  // Both direct and proxy are shown; empty series (no streaming run) is '—'.
  const ttftD = ttft.direct && isNum(ttft.direct.mean) ? ttft.direct.mean : NaN;
  const ttftP = ttft.proxy && isNum(ttft.proxy.mean) ? ttft.proxy.mean : NaN;
  const ttftHasData = isNum(ttftD) || isNum(ttftP);
  cards.appendChild(card('Time-to-first-token (TTFT)',
    ttftHasData ? `${isNum(ttftP)?fmtSec(ttftP):'—'} / ${isNum(ttftD)?fmtSec(ttftD):'—'}` : '—',
    ttftHasData ? '' : 'info',
    ttftHasData
      ? `proxy ${isNum(ttftP)?fmtSec(ttftP):'n/a'} vs direct ${isNum(ttftD)?fmtSec(ttftD):'n/a'} (streaming run)`
      : 'no TTFT captured (run with --measure-ttft)'));
  const obsErrors = obs && isNum(obs.backend_errors) ? obs.backend_errors : NaN;
  const obsDegradations = obs && isNum(obs.degradation_events) ? obs.degradation_events : NaN;
  cards.appendChild(card('Proxy overhead / failures',
    isNum(obs.avg_optimizer_ms) ? `${fmtMs(obs.avg_optimizer_ms)} / ${isNum(obs.avg_token_count_ms)?fmtMs(obs.avg_token_count_ms):'—'}` : '—',
    (obsErrors>0||obsDegradations>0)?'bad':(isNum(obs.avg_optimizer_ms)?'':'info'),
    `optimizer / token count · ${isNum(obsErrors)?obsErrors:'—'} backend errors · ${isNum(obsDegradations)?obsDegradations:'—'} degradation events`));
  const tpsD = perf.approximate_decode_tps && perf.approximate_decode_tps.direct;
  const tpsP = perf.approximate_decode_tps && perf.approximate_decode_tps.proxy;
  cards.appendChild(card('Request-level throughput estimate',
    (tpsD&&isNum(tpsD.mean))||(tpsP&&isNum(tpsP.mean))
      ? `${tpsP&&isNum(tpsP.mean)?tpsP.mean.toFixed(1):'—'} / ${tpsD&&isNum(tpsD.mean)?tpsD.mean.toFixed(1):'—'} tok/s`
      : '—', 'info', 'proxy / direct · derived from completion tokens, latency, and TTFT'));
  cards.appendChild(metricLabel('Context retention & quality'));
  // PRIMARY quality signal: context retention (the optimizer's actual job).
  // Promoted to the top of the quality cards — these are what a context
  // optimizer is measured on, not response-vs-response similarity.
  cards.appendChild(card('Source-token recall', faith&&faith.mean!=null?fmt2(faith.mean):'—',
    faith&&faith.mean!=null?(faith.mean>=0.7?'good':faith.mean>=0.5?'warn':'bad'):'',
    `PRIMARY · min ${faith&&faith.min!=null?fmt2(faith.min):'—'} · unique source tokens retained`));
  cards.appendChild(card('Evicted-content recall', evict&&evict.mean!=null?fmt2(evict.mean):'—',
    evict&&evict.mean!=null?(evict.mean>=0.7?'good':evict.mean>=0.5?'warn':'bad'):'',
    `PRIMARY · min ${evict&&evict.min!=null?fmt2(evict.min):'—'} · early-turn content carried fwd`));
  // Semantic sim is INFORMATIONAL ONLY (weak on code, noisy at long outputs).
  // Demoted below the primary context-retention cards and explicitly labelled.
  cards.appendChild(card('Mean semantic sim', fmt2(sem.mean), 'info',
    `informational only · min ${fmt2(sem.min)} · median ${fmt2(sem.median)}`));
  cards.appendChild(card('Final context utilization', fmtPct(ctxw.utilization_pct), isNum(ctxw.utilization_pct)?(ctxw.utilization_pct<75?'good':'warn'):'info',
    `proxy final prompt ${fmt(ctxw.final_prompt_tokens)} / ${fmt(ctxw.max_context_window)} tok`));
  const qskip = q.quality_skipped_turns||0;
  cards.appendChild(card('Quality-skipped turns', fmt(qskip), qskip===0?'good':'warn',
    `${fmt(qskip)} / ${fmt(J.num_turns)} excluded · low-sem ${q.low_semantic_similarity_turns||0} · trunc ${q.truncation_count||0}`));
  cards.appendChild(card('Invalid code turns', fmt((q.code_syntax_invalid_turns||[]).length),
    (q.code_syntax_invalid_turns||[]).length===0?'good':'warn', 'proxy response syntax checks only'));
  const blog = J.backendLogs || {};
  const blogStatus = String(blog.status || 'not_enabled');
  const blogStatusClass = blogStatus === 'connected' || blogStatus === 'stopped' ? 'good' :
    (blogStatus === 'not_enabled' || blogStatus.startsWith('unavailable')) ? 'info' : 'warn';
  cards.appendChild(metricLabel('Cache & backend telemetry'));
  const cacheRounds = cache.per_round_proxy_metrics||[];
  const cacheRequests = cacheRounds.reduce((n,r)=>n+(isNum(r.requests)?r.requests:0),0);
  const cacheHits = cacheRounds.reduce((n,r)=>n+(isNum(r.cache_hits)?r.cache_hits:0),0);
  const cacheRate = cacheRequests>0 ? cacheHits/cacheRequests : NaN;
  cards.appendChild(card('Prefix cache hit rate', fmtPct(cacheRate*100), isNum(cacheRate)?(cacheRate>=0.9?'good':cacheRate>0?'warn':'bad'):'info',
    isNum(cacheRate) ? `${fmt(cacheHits)} / ${fmt(cacheRequests)} requests` : 'no request-level cache counters'));
  const mtpRate = mtp && isNum(mtp.acceptance_rate) ? mtp.acceptance_rate : NaN;
  cards.appendChild(card('MTP acceptance rate', isNum(mtpRate)?fmtPct(mtpRate*100):'—',
    isNum(mtpRate)?(mtpRate>=0.5?'good':mtpRate>0?'warn':'bad'):'info',
    isNum(mtpRate)
      ? `${fmt(mtp.total_accepted_tokens)} accepted / ${fmt(mtp.total_draft_tokens)} drafted tokens`
      : 'no backend MTP counters reported'));
  cards.appendChild(card('Backend log capture', blogStatus === 'not_enabled' ? '—' : blogStatus,
    blogStatusClass, `${fmt(blog.event_count)} events · ${fmt(blog.dropped_events)} dropped`));

  // ---- long-horizon / cross-turn cards ----
  // These answer "does the proxy still remember early context by Turn N?" — the
  // core risk of a context compressor. fact_recall = recall of Turn-1 facts at
  // the final probe turn; contradictions = self-contradictions within the
  // session (lower bound, heuristic); wall = first turn quality collapses.
  const lh = J.longHorizon || {};
  const fr = lh.fact_recall_turn30 || lh.fact_recall || null;
  const ct = lh.contradictions || null;
  const wall = lh.context_window_wall || null;
  const frP = fr && isNum(fr.proxy) ? fr.proxy : NaN;
  const frD = fr && isNum(fr.direct) ? fr.direct : NaN;
  cards.appendChild(metricLabel('Long-horizon behavior'));
  cards.appendChild(card('Fact recall @ Turn N (drift)',
    (isNum(frP)||isNum(frD)) ? `${isNum(frP)?fmtPct(frP*100):'—'} / ${isNum(frD)?fmtPct(frD*100):'—'}` : '—',
    isNum(frP) ? (frP>=0.8?'good':frP>=0.6?'warn':'bad') : 'info',
    `proxy / direct · recall of Turn-1 facts at final probe turn (lower proxy = context drift)`));
  const ctP = ct && isNum(ct.proxy) ? ct.proxy : NaN;
  const ctD = ct && isNum(ct.direct) ? ct.direct : NaN;
  cards.appendChild(card('Self-contradictions (session)',
    (isNum(ctP)||isNum(ctD)) ? `${isNum(ctP)?ctP:'—'} / ${isNum(ctD)?ctD:'—'}` : '—',
    isNum(ctP) ? (ctP<=ctD?'good':'warn') : 'info',
    `proxy / direct · heuristic lower bound (negation-flip only)`));
  const wP = wall && isNum(wall.proxy) ? wall.proxy : NaN;
  const wD = wall && isNum(wall.direct) ? wall.direct : NaN;
  cards.appendChild(card('Context-window wall (turn)',
    (isNum(wP)||isNum(wD)) ? `${isNum(wP)?wP:'—'} / ${isNum(wD)?wD:'—'}` : '—',
    isNum(wP) ? 'warn' : 'good',
    `proxy / direct · heuristic sustained quality drop (null = none detected)`));
  root.appendChild(cards);

  // Backend logs render after the complete dashboard, below all other tables.
  const profile = blog.profile || {};

  // ---- primary-signal callout ----
  // Make the metric hierarchy explicit: context faithfulness + evicted recall
  // are the optimizer's real job (input compaction); response-vs-response
  // similarity is informational only and expected to be low at long outputs.
  const note=el('div','callout');
  note.appendChild(Object.assign(el('div','callout-title'),{textContent:'How to read quality'}));
  note.appendChild(Object.assign(el('p'),{textContent:
    'PRIMARY input-preservation signals (top cards + Optimizer quality table): Source-token recall is the fraction of unique tokens from the full prompt still present after compaction. The legacy faithfulness score is token-set Jaccard, so it also penalizes added summary tokens. Evicted-content recall is a heuristic recall of tokens from the early prompt, not an entity-aware measure.'}));
  note.appendChild(Object.assign(el('p'),{textContent:
    'INFORMATIONAL only: Semantic similarity, ROUGE/Jaccard/edit overlap, and response stability compare the proxy\'s answer to the direct (un-compressed) answer. They conflate optimizer quality with the model\'s phrasing variance and are weak on code, so low absolute values are EXPECTED (not a defect) — especially at long outputs (max_tokens ≥ 8192), where the two prompts produce genuinely different long answers.'}));
  // ---- charts grid ----
  const grid=el('div','grid');
  const chartLabel = text => Object.assign(el('div','chart-label'),{textContent:text});
  grid.appendChild(chartLabel('Latency & generation'));

  // Latency distribution (direct vs proxy) — boxplot of per-turn latency (#1),
  // matching the other summary-statistics charts.
  if(lat.direct&&lat.proxy){
    grid.appendChild(panel('Latency (direct vs proxy)','ms',
      {type:'boxplot',labels:['Direct','Proxy'],datasets:[
        {label:'Direct',color:PALETTE.direct,data:[lat.direct,null]},
        {label:'Proxy',color:PALETTE.proxy,data:[null,lat.proxy]}
      ],yFmt:fmtSec},
      'Per-turn total request latency distribution: box = q1..q3, center line = median, ✕ = mean, whiskers = min..max.'));
  }

  // TTFT growth curve (latency compounding) — per-turn TTFT from the log.
  // Shows whether the proxy's time-to-first-token grows faster than direct as
  // the prompt history accumulates each turn (the "compounding" risk of a
  // compressor). Empty series (non-streaming run) renders as '—'.
  if(L && L.turns){
    const idx=Object.keys(L.turns).map(Number).sort((a,b)=>a-b);
    const pd=idx.map(i=>L.turns[i].ttft_direct_ms);
    const pp=idx.map(i=>L.turns[i].ttft_proxy_ms);
    if(pd.some(isNum)||pp.some(isNum)){
      grid.appendChild(panel('TTFT growth per turn (proxy vs direct)','ms',
        lineBarCfg(idx.map(String),[
          {label:'Direct',color:PALETTE.direct,type:'line',data:pd},
          {label:'Proxy',color:PALETTE.proxy,type:'line',data:pp}
        ], fmtSec), 'Per-turn time-to-first-token. A steeper proxy slope = TTFT compounding (the proxy pays more each turn as history grows).'));
    }
  }

  grid.appendChild(chartLabel('Prompt & cache economics'));
  if(perf.per_turn && perf.per_turn.length){
    // Surface the cache→TTFT Pearson r (benchmark.py cache_ttft) inline: a strong
    // positive value means more re-prefill ⇒ slower first token, so a reuse
    // regression shows up here before the aggregate TTFT mean moves (D2).
    const corr=J.cache_ttft.fresh_prefill_vs_ttft_correlation;
    let corrNote='';
    if(isNum(corr)){
      const strength=Math.abs(corr)>=0.7?'strong':Math.abs(corr)>=0.4?'moderate':'weak';
      const dir=corr>=0?'positive':'negative';
      corrNote=` Proxy fresh-prefill↔TTFT Pearson r = ${corr.toFixed(2)} (${strength} ${dir}).`;
    }
    grid.appendChild(panel('Fresh prefill by turn (proxy vs direct)','tok',
      lineBarCfg(perf.per_turn.map(r=>'T'+r.turn),[
        {label:'Direct fresh prefill',color:PALETTE.direct,type:'line',data:perf.per_turn.map(r=>r.direct_fresh_prefill_tokens)},
        {label:'Proxy fresh prefill',color:PALETTE.proxy,type:'line',data:perf.per_turn.map(r=>r.proxy_fresh_prefill_tokens)}
      ], fmt),
      'Per-turn prompt tokens minus cached tokens. Compare this with the TTFT chart above; a fresh-prefill spike should explain a matching TTFT spike.'+corrNote));
  }

  // Token usage per turn (from log) OR aggregate
  if(J.raw.tokens && J.raw.tokens.per_turn_direct && J.raw.tokens.per_turn_proxy){
    const pd=J.raw.tokens.per_turn_direct, pp=J.raw.tokens.per_turn_proxy;
    grid.appendChild(panel('Prompt tokens / turn (summary statistics)','tok',
      {type:'boxplot',labels:['Direct','Proxy'],datasets:[
        {label:'Direct',color:PALETTE.direct,data:[pd,null]},
        {label:'Proxy',color:PALETTE.proxy,data:[null,pp]}
      ],yFmt:fmt}, 'Per-turn distribution: box = q1..q3, center line = median, ✕ = mean, whiskers = min..max. Proxy keeps each turn small.'));
  }

  if(perf.fresh_prefill_tokens && (perf.fresh_prefill_tokens.direct||perf.fresh_prefill_tokens.proxy)){
    const d=perf.fresh_prefill_tokens.direct?.q1!=null?perf.fresh_prefill_tokens.direct:statsFromValues((perf.per_turn||[]).map(r=>r.direct_fresh_prefill_tokens));
    const p=perf.fresh_prefill_tokens.proxy?.q1!=null?perf.fresh_prefill_tokens.proxy:statsFromValues((perf.per_turn||[]).map(r=>r.proxy_fresh_prefill_tokens));
    grid.appendChild(panel('Fresh prefill tokens (summary statistics)','tok',
      {type:'boxplot',labels:['Direct','Proxy'],datasets:[
        {label:'Direct',color:PALETTE.direct,data:[d,null]},
        {label:'Proxy',color:PALETTE.proxy,data:[null,p]}
      ],yFmt:fmt}, 'Fresh prefill distribution: box = q1..q3, center line = median, ✕ = mean, whiskers = min..max. Lower values indicate more prefix reuse.'));
  }

  if(perf.cache_reuse_pct && (perf.cache_reuse_pct.direct||perf.cache_reuse_pct.proxy)){
    // Exclude the cold first turn (always 0% reuse — nothing cached yet) so it
    // does not contaminate the min/whisker of the distribution (#2). Turns are
    // 1-indexed, so drop the minimum turn number rather than filtering on > 0.
    const reuseTurns=(perf.per_turn||[]);
    const minTurn=reuseTurns.length?Math.min(...reuseTurns.map(r=>Number(r.turn))):0;
    const measuredTurns=reuseTurns.filter(r=>Number(r.turn)>minTurn);
    const d=statsFromValues(measuredTurns.map(r=>isNum(r.direct_cache_reuse_pct)?Math.min(100,Math.max(0,r.direct_cache_reuse_pct)):NaN));
    const p=statsFromValues(measuredTurns.map(r=>isNum(r.proxy_cache_reuse_pct)?Math.min(100,Math.max(0,r.proxy_cache_reuse_pct)):NaN));
    const summaryD=boundedPctStats(perf.cache_reuse_pct.direct), summaryP=boundedPctStats(perf.cache_reuse_pct.proxy);
    if(!Object.keys(d).length && Object.keys(summaryD).length) Object.assign(d,summaryD);
    if(!Object.keys(p).length && Object.keys(summaryP).length) Object.assign(p,summaryP);
    grid.appendChild(panel('Cache reuse ratio (direct vs proxy)','%',
      {type:'boxplot',labels:['Direct','Proxy'],datasets:[
        {label:'Direct',color:PALETTE.direct,data:[d,null]},
        {label:'Proxy',color:PALETTE.proxy,data:[null,p]}
      ],yFmt:v=>isNum(v)?v.toFixed(1)+'%':'—',yMin:0,yMax:100},
      'Cached prompt tokens divided by total prompt tokens. Box = q1..q3, center line = median, ✕ = mean, whiskers = min..max.'));
  }

  const hasTpsRows=(perf.per_turn||[]).some(r=>isNum(r.direct_approx_decode_tps)||isNum(r.proxy_approx_decode_tps));
  const hasTpsSummary=[tpsD,tpsP].some(s=>s&&isNum(s.min)&&isNum(s.median)&&isNum(s.max));
  if(perf.approximate_decode_tps && (hasTpsSummary||hasTpsRows)){
    const d=tpsD?.q1!=null?tpsD:statsFromValues((perf.per_turn||[]).map(r=>r.direct_approx_decode_tps));
    const p=tpsP?.q1!=null?tpsP:statsFromValues((perf.per_turn||[]).map(r=>r.proxy_approx_decode_tps));
    grid.appendChild(panel('Approximate decode throughput','tok/s',
      {type:'boxplot',labels:['Direct','Proxy'],datasets:[
        {label:'Direct',color:PALETTE.direct,data:[d,null]},
        {label:'Proxy',color:PALETTE.proxy,data:[null,p]}
      ],yFmt:v=>isNum(v)?v.toFixed(1):'—'},
      'Approximation only: completion tokens / (request latency − TTFT). Box = q1..q3, center line = median, ✕ = mean, whiskers = min..max; it is not backend instrumentation.'));
  }

  if(perf.per_turn && perf.per_turn.length){
    grid.appendChild(panel('Prompt and completion tokens per turn','tok',
      lineBarCfg(perf.per_turn.map(r=>'T'+r.turn),[
        {label:'Direct prompt',color:PALETTE.direct,type:'line',data:perf.per_turn.map(r=>r.direct_prompt_tokens)},
        {label:'Proxy prompt',color:PALETTE.proxy,type:'line',data:perf.per_turn.map(r=>r.proxy_prompt_tokens)},
        {label:'Direct completion',color:PALETTE.directSoft,type:'line',data:perf.per_turn.map(r=>r.direct_completion_tokens)},
        {label:'Proxy completion',color:PALETTE.proxySoft,type:'line',data:perf.per_turn.map(r=>r.proxy_completion_tokens)}
      ], fmt), 'Prompt size is the proxy-controlled input signal; completion tokens remain model behavior.'));
  }

  grid.appendChild(chartLabel('Proxy overhead'));
  if(obs && obs.per_round && obs.per_round.length){
    const labels=obs.per_round.map(r=>'R'+(Number(r.round)+1));
    grid.appendChild(panel('Proxy processing overhead per round','ms',
      lineBarCfg(labels,[
        {label:'Optimizer',color:PALETTE.jaccard,type:'bar',data:obs.per_round.map(r=>r.avg_optimizer_ms)},
        {label:'Token count',color:PALETTE.cache,type:'bar',data:obs.per_round.map(r=>r.avg_token_count_ms)}
      ], fmtMs),
      'Proxy-side work only. Backend generation latency is excluded; backend errors and degradation events are shown in the summary card.'));
  }

  grid.appendChild(chartLabel('Context retention & quality'));
  grid.appendChild(note);

  // Quality metrics — radar (multivariate 0–1 comparison)
  // Keep the radar for a compact overview, but only combine comparable
  // input-retention and proxy-output correctness measures.
  // Response-vs-response overlap scores (ROUGE/Jaccard/edit) and Semantic sim
  // are now secondary (see the secondary radar + quality detail below).
  const semRadar = sem&&isNum(sem.mean) ? (sem.mean+1)/2 : NaN;
  if(faith||evict||q.code_syntax_validity||q.code_block_ratio||isNum(semRadar)){
    const labels=['Source recall','Evicted recall','Syntax valid','Code blocks','Semantic sim*'];
    // Radar axes are 0..1. Code struct is a 0..1 consistency score, so no
    // clamping needed. (Semantic sim was moved to the secondary radar because
    // it is a cosine in [-1,1] and the noisiest of the metrics.)
    const mk=(o)=>o&&o.mean!=null?Math.max(0,o.mean):NaN;
    grid.appendChild(panel('Optimizer quality (mean, 0–1)','score',
      {type:'radar', labels,
        datasets:[
          {label:'Input, correctness + response diagnostic',color:PALETTE.sem,data:[mk(faith),mk(evict),mk(q.code_syntax_validity),mk(q.code_block_ratio),semRadar]}
        ], yFmt:fmt2, yMin:0, yMax:1},
      'Mean scores across measured turns. Source recall and evicted recall measure input preservation; syntax validity and code-block ratio are diagnostics. Semantic sim* is response cosine normalized from −1..1 to 0..1 for this radar only; see the signed chart below.'));
  }

  // Secondary / informational quality metrics — radar (0–1).
  // These compare responses, so they stay with the quality guidance rather
  // than getting their own response-comparison section.
  // ROUGE-L F1 / token Jaccard / edit similarity live in secondary_quality (sec),
  // NOT quality (q) — reading them from q yielded NaN and dropped the axes (#4).
  // Fall back to q for older reports that filed them there.
  const rougeF1=sec.rouge_l_f1||q.rouge_l_f1;
  const tokenJaccard=sec.token_jaccard||q.token_jaccard;
  const editSim=sec.edit_similarity||q.edit_similarity;
  if(rougeF1||tokenJaccard||editSim||sec.trigram_overlap||sec.markdown_structure_similarity){
    const labels=['ROUGE-L F1','Token Jaccard','Edit sim','Trigram overlap','Markdown struct'];
    const mk=(o)=>o&&o.mean!=null?o.mean:NaN;
    grid.appendChild(panel('Secondary quality metrics (mean, 0–1, informational)','score',
      {type:'radar', labels,
        datasets:[
          {label:'Secondary quality (proxy vs direct)',color:PALETTE.rouge,data:[mk(rougeF1),mk(tokenJaccard),mk(editSim),mk(sec.trigram_overlap),mk(sec.markdown_structure_similarity)]}
        ], yFmt:fmt2, yMin:0, yMax:1},
      'Informational only — response-vs-response overlap. Low absolute values are expected (LLM phrasing variance), NOT optimizer failure. Semantic similarity is shown separately because its cosine scale is signed.'));
  }
  if(sem && sem.mean!=null){
    // The report aggregate carries mean/median/min/max but NO quartiles, which
    // collapses the box to q1=q3=median (#5). Recompute proper quartiles (and
    // mean) from the per-turn cosine values when the log provides them.
    const semVals=(L.turnList||[]).map(t=>t.sem).filter(isNum);
    const semStats=semVals.length>=2?statsFromValues(semVals):sem;
    grid.appendChild(panel('Semantic similarity (signed, informational)','score',
      {type:'boxplot', labels:['Proxy vs direct'], datasets:[{label:'Cosine similarity',color:PALETTE.sem,data:[semStats]}], yFmt:fmt2, yMin:-1, yMax:1},
      'Cosine similarity distribution: box = q1..q3, center line = median, ✕ = mean, whiskers = min..max. Negative values are valid; this is informational and weak on code-heavy traffic.'));
  }

  grid.appendChild(chartLabel('Cache & MTP telemetry'));
  // Aggregate per-turn telemetry so the chart remains useful even when the
  // proxy metrics snapshot is unavailable or the run contains one round.
  const cacheByRound=new Map();
  for(const r of (perf.per_turn||[])){
    const key=Number(r.round); const entry=cacheByRound.get(key)||{hits:0,total:0,reuse:[]};
    entry.total++;
    if(isNum(r.proxy_prefix_cache_hit_tokens)&&r.proxy_prefix_cache_hit_tokens>0) entry.hits++;
    if(isNum(r.proxy_cache_reuse_pct)) entry.reuse.push(r.proxy_cache_reuse_pct);
    cacheByRound.set(key,entry);
  }
  const hasPerTurnHit=(perf.per_turn||[]).some(r=>isNum(r.proxy_prefix_cache_hit_tokens));
  const hasPerTurnReuse=(perf.per_turn||[]).some(r=>isNum(r.proxy_cache_reuse_pct));
  const cacheSnapshots=cache.per_round_proxy_metrics||[];
  if(hasPerTurnHit){
    const rounds=[...cacheByRound.keys()].sort((a,b)=>a-b), labels=rounds.map(r=>'R'+(r+1));
    grid.appendChild(panel('Cache hit rate per round (requests)','%',
      lineBarCfg(labels,[{label:'Cache hit rate',color:PALETTE.cache,type:'bar',data:rounds.map(r=>{const x=cacheByRound.get(r);return x.total?x.hits/x.total*100:NaN;})}],
        v=>isNum(v)?v.toFixed(0)+'%':'—', 0, 100),
      'Percentage of requests with a prefix-cache hit.'));
  } else if(cacheSnapshots.length){
    const labels=cacheSnapshots.map(r=>'R'+(Number(r.round)+1));
    grid.appendChild(panel('Cache hit rate per round (requests)','%',
      lineBarCfg(labels,[{label:'Cache hit rate',color:PALETTE.cache,type:'bar',data:cacheSnapshots.map(r=>isNum(r.cache_hit_rate)?r.cache_hit_rate*100:NaN)}],v=>isNum(v)?v.toFixed(0)+'%':'—',0,100),
      'Percentage of requests with a prefix-cache hit.'));
  }
  if(hasPerTurnReuse){
    const rounds=[...cacheByRound.keys()].sort((a,b)=>a-b), labels=rounds.map(r=>'R'+(r+1));
    grid.appendChild(panel('Cache reuse ratio per round (tokens)','%',
      lineBarCfg(labels,[{label:'Reuse ratio',color:'#ff7bd5',type:'bar',data:rounds.map(r=>{const values=cacheByRound.get(r).reuse;return values.length?values.reduce((a,b)=>a+b,0)/values.length:NaN;})}],
        v=>isNum(v)?v.toFixed(0)+'%':'—', 0, 100),
      'Percentage of prompt tokens served from the prefix cache.'));
  } else if(cacheSnapshots.length){
    const labels=cacheSnapshots.map(r=>'R'+(Number(r.round)+1));
    grid.appendChild(panel('Cache reuse ratio per round (tokens)','%',
      lineBarCfg(labels,[{label:'Reuse ratio',color:'#ff7bd5',type:'bar',data:cacheSnapshots.map(r=>isNum(r.prefix_cache_reuse_ratio)?Math.min(1,r.prefix_cache_reuse_ratio)*100:NaN)}],v=>isNum(v)?v.toFixed(0)+'%':'—',0,100),
      'Percentage of prompt tokens served from the prefix cache.'));
  }

  if(mtp && mtp.per_round && mtp.per_round.length){
    const labels=mtp.per_round.map(r=>'R'+(Number(r.round)+1));
    const boxStats=values=>{const s=values.filter(isNum).sort((a,b)=>a-b);return s.length?{min:s[0],q1:s[Math.floor((s.length-1)*.25)],median:s[Math.floor((s.length-1)*.5)],q3:s[Math.floor((s.length-1)*.75)],max:s[s.length-1],mean:s.reduce((a,b)=>a+b,0)/s.length}:null;};
    const byRound=new Map();
    for(const r of (mtp.per_turn||[])){const a=byRound.get(Number(r.round))||[];if(isNum(r.acceptance_rate))a.push(r.acceptance_rate*100);byRound.set(Number(r.round),a);}
    grid.appendChild(panel('MTP acceptance per round','%',
      {type:'boxplot',labels,datasets:[{label:'Accepted / drafted',color:PALETTE.sem,data:mtp.per_round.map(r=>boxStats(byRound.get(Number(r.round))||[]))}],yFmt:v=>isNum(v)?v.toFixed(0)+'%':'—',yMin:0,yMax:100},
      'Backend-reported per-turn acceptance distribution by round: box = q1..q3, center line = median, ✕ = mean, whiskers = min..max. Acceptance does not by itself prove faster generation.'));
  }

  if(mtp && mtp.per_turn && mtp.per_turn.length){
    const turns=[...new Set(mtp.per_turn.map(r=>`R${Number(r.round)+1} T${r.turn}`))];
    const values=(phase)=>turns.map(label=>{
      const match=mtp.per_turn.find(r=>`R${Number(r.round)+1} T${r.turn}`===label && r.phase===phase);
      return match && isNum(match.acceptance_rate) ? match.acceptance_rate*100 : NaN;
    });
    grid.appendChild(panel('MTP acceptance per turn','%',
      lineBarCfg(turns,[
        {label:'Direct',color:PALETTE.direct,type:'line',data:values('direct')},
        {label:'Proxy',color:PALETTE.proxy,type:'line',data:values('proxy')}
      ], v=>isNum(v)?v.toFixed(0)+'%':'—', 0, 100),
      'Draft acceptance parsed from streaming backend logs. Values compare direct and proxy requests by benchmark turn.'));
    if(perf.per_turn && perf.per_turn.length){
      const perfByTurn=new Map(perf.per_turn.map(r=>[`${r.round}:${r.turn}`,r]));
      const throughput=(phase)=>turns.map(label=>{
        const match=mtp.per_turn.find(r=>`R${Number(r.round)+1} T${r.turn}`===label && r.phase===phase);
        const row=match&&perfByTurn.get(`${match.round}:${match.turn}`);
        return row&&isNum(row[`${phase}_approx_decode_tps`]) ? row[`${phase}_approx_decode_tps`] : NaN;
      });
      // Acceptance is already shown in "MTP acceptance per turn"; keep this chart
      // throughput-only so its 2 series get 2 distinct colors instead of a
      // confusing 4-series / 2-color dual-axis mix (#6).
      grid.appendChild(panel('Approximate decode throughput per turn','tok/s',
        lineBarCfg(turns,[
          {label:'Direct request TPS',color:PALETTE.direct,type:'line',data:throughput('direct')},
          {label:'Proxy request TPS',color:PALETTE.proxy,type:'line',data:throughput('proxy')}
        ], v=>isNum(v)?v.toFixed(1):'—'),
        'Request-level decode throughput estimate per turn (completion tokens / (latency − TTFT)). Draft acceptance is shown in the MTP acceptance per turn chart. Correlation is descriptive, not proof that MTP caused a speed change.'));
    }
  }

  // Authoritative backend throughput, parsed from the captured llama.cpp
  // print_timing log lines (backend_logs.events). Broken down by type:
  // prompt-eval (prompt processing), generation (decode), and total
  // (Inference completed). Unlike the approximate decode TPS above (derived
  // from request timings), these are measured by the backend itself. Only
  // rendered when backend log capture was available for this run.
  const blEvents=(J.backendLogs&&J.backendLogs.events)||[];
  const tpsByTurn=new Map();
  for(const e of blEvents){
    const line=e.line;
    if(typeof line!=='string'||e.phase!=='proxy'||e.turn==null) continue;
    const t=Number(e.turn);
    const rec=tpsByTurn.get(t)||{};
    let m;
    if(line.includes('prompt eval time =')&&(m=line.match(/prompt eval time\s*=[\s\S]*?\(\s*[\d.]+\s*ms per token,\s*([\d.]+)\s*tokens per second/))){
      rec.prompt=parseFloat(m[1]);
    } else if(!line.includes('prompt eval time')&&line.includes('eval time =')&&(m=line.match(/eval time\s*=[\s\S]*?\(\s*[\d.]+\s*ms per token,\s*([\d.]+)\s*tokens per second/))){
      rec.gen=parseFloat(m[1]);
    }
    tpsByTurn.set(t,rec);
  }
  if(tpsByTurn.size){
    const tpsTurns=[...tpsByTurn.keys()].sort((a,b)=>a-b);
    const tpsLabels=tpsTurns.map(t=>'T'+t);
    const tpsCol=(k)=>tpsTurns.map(t=>{const v=tpsByTurn.get(t)[k];return isNum(v)?v:NaN;});
    grid.appendChild(panel('Backend throughput per turn (from backend logs)','tok/s',
      {dual:true, labels:tpsLabels, datasets:[
        {label:'Generation TPS',color:PALETTE.sem,type:'line',data:tpsCol('gen')},
        {label:'Prompt-eval TPS',color:PALETTE.jaccard,axis:'y1',type:'line',data:tpsCol('prompt')}
      ], yFmt:v=>isNum(v)?v.toFixed(0):'—', yFmt1:v=>isNum(v)?v.toFixed(0):'—'},
      'Authoritative backend-measured throughput from llama.cpp print_timing log lines (proxy requests), by inference phase: generation (decode) on the left axis, prompt-processing on the right (different scale). The backend\'s "Inference completed: tps" equals the generation TPS, so it is not plotted separately. Only present when backend log capture was available.'));
  }

  grid.appendChild(chartLabel('Compaction impact'));
  if(pr && pr._pooled==null && Object.keys(pr).length){
    const rounds=Object.keys(pr).filter(k=>k!=='_pooled').map(Number).sort((a,b)=>a-b);
    if(rounds.length){
      const labels=rounds.map(r=>'R'+(r+1));
      grid.appendChild(panel('Per-round token savings','%',
        lineBarCfg(labels,[
          {label:'Token savings %',color:PALETTE.sem,type:'bar',data:rounds.map(r=>pr[r].token_savings_pct)}
        ], v=>isNum(v)?v.toFixed(1)+'%':'—', 0, null),
        'Each round is an independent replay. Read this alongside the per-turn savings chart to see whether compaction is stable across runs.'));
    }
  }
  // Eviction / compaction — per-turn TOKEN SAVINGS (proxy vs direct prompt tokens).
  // Derived from the same per-turn token counts as "Prompt tokens per turn", but
  // shows the savings magnitude per turn rather than the two raw series.
  if(ev && ev.total_chars_before_optimization){
    const exceed = ev.turns_raw_exceeds_optimized_target != null ? ev.turns_raw_exceeds_optimized_target : 0;
    const evict = ev.eviction_triggered_at_turns ? ev.eviction_triggered_at_turns.length : 0;
    const desc = `Budget ${fmt(ev.char_budget)} chars/turn · ${exceed} turns exceeded target · ${evict} evictions triggered · ${fmt(ev.total_chars_before_optimization)} raw chars total. Savings % = (proxy RAW input − optimized output) ÷ raw input × 100 per turn — isolates the optimizer's own compaction from direct-path tokenization.`;
    // Prefer the proxy's raw input tokens (what the proxy received) as the
    // baseline. Fall back to direct_tok only when raw_input_tok is unavailable
    // (older logs / JSON without the field).
    const ptAll = (L && L.turnList) ? L.turnList : [];
    const pt = ptAll.filter(t=>isNum(t.proxy_tok)&&t.proxy_tok>0&&(isNum(t.raw_input_tok)?t.raw_input_tok>0:isNum(t.direct_tok)&&t.direct_tok>0));
    if(pt.length){
      // Flag failed/estimated turns so their savings % (computed against an
      // estimated direct baseline) is not read as a real measurement.
      const {bad}=detectBadTurns(J,L);
      const ptFlagged=new Set(); pt.forEach((t,i)=>{ if(bad.has(t.turn)) ptFlagged.add(i); });
      const cfg={labels:pt.map(t=>'T'+t.turn), roundSize:isNum(ri.numTurns)?ri.numTurns:null, flagged:ptFlagged,
        datasets:[
          {label:'Savings % (vs proxy raw input)',color:PALETTE.proxy,data:pt.map(t=>{
            const base = isNum(t.raw_input_tok)&&t.raw_input_tok>0 ? t.raw_input_tok : t.direct_tok;
            return (base - t.proxy_tok)/base*100;
          })},
          {label:'Savings % (vs direct)',color:PALETTE.direct,data:pt.map(t=>{
            const base = isNum(t.direct_tok)&&t.direct_tok>0 ? t.direct_tok : t.raw_input_tok;
            return (base - t.proxy_tok)/base*100;
          })}
        ], yFmt:v=>isNum(v)?v.toFixed(1)+'%':'—', yMin:0};
      grid.appendChild(panel('Token savings per turn (proxy raw input → optimized)','%',
        cfg, desc+' Two baselines shown: <b>vs proxy raw input</b> isolates the optimizer\'s own compaction (the honest metric); <b>vs direct</b> is inflated because the direct path sends the full un-compacted context every turn. Red ✕ = savings vs an estimated (failed) baseline; omitted.'));
    } else {
      const sp = isNum(J.tokens.token_savings_vs_raw_pct) ? J.tokens.token_savings_vs_raw_pct
               : (isNum(J.tokens.token_savings_pct) ? J.tokens.token_savings_pct : NaN);
      grid.appendChild(panel('Token savings (aggregate)','%',
        {labels:['Savings %'],
          datasets:[
            {label:'Token savings %',color:PALETTE.sem,type:'bar',data:[sp]}
          ], yFmt:v=>isNum(v)?v.toFixed(1)+'%':'—', yMin:0      }, desc));
    }
  }

  root.appendChild(grid);

  // ---- tables ----
  const tables=el('div','tables');
  if(Object.keys(profile).length){
    tables.appendChild(sectionTitle('Backend configuration snapshot'));
    tables.appendChild(kvTable('Setting', [
      ['Version', profile.version || '—'],
      ['Model', profile.model || '—'],
      ['Context window', isNum(profile.context_window) ? fmt(profile.context_window)+' tok' : '—'],
      ['Cache RAM', isNum(profile.cache_ram_mb) ? fmt(profile.cache_ram_mb)+' MB' : '—'],
      ['Cache reuse', isNum(profile.cache_reuse_tokens) ? fmt(profile.cache_reuse_tokens)+' tok' : '—'],
      ['Draft/MTP configured', profile.draft_enabled == null ? '—' : (profile.draft_enabled ? 'yes' : 'no')]
    ]));
  }
  tables.appendChild(sectionTitle('Run configuration'));
  tables.appendChild(kvTable('Config', Object.entries(c).map(([k,v])=>[k, typeof v==='object'?JSON.stringify(v):String(v)])));

  if(pr && Object.keys(pr).length){
